<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#090b10"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-180.png">
<title>RynqTracker</title>
<style>
:root{--team:#2282c3}*{box-sizing:border-box}body{margin:0;background:#090b10;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{max-width:430px;margin:auto;min-height:100vh;padding:22px 18px 105px}.top{display:flex;justify-content:center;align-items:center;position:relative;min-height:54px}.top .pill{position:absolute;right:0}.brand{display:flex;align-items:center;justify-content:center}.brand img{width:54px;height:54px;border-radius:16px;object-fit:cover;display:block}button{font:inherit}.pill,.chip,.smallbtn{border:1px solid #293242;background:#141923;color:#fff;border-radius:14px;padding:9px 12px;font-weight:800}.hero,.panel{margin-top:20px;padding:20px;border:1px solid #242b37;border-radius:26px;background:linear-gradient(145deg,#171c26,#0e1118)}.label{font-size:11px;letter-spacing:1.5px;color:#8b96a8;font-weight:800}.teamscore{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;margin:18px 0}.team{text-align:center}.logo{width:66px;height:66px;margin:auto;border-radius:20px;display:grid;place-items:center;background:#202837;font-size:22px;font-weight:900;overflow:hidden}.logo img{width:100%;height:100%;object-fit:cover}.score{font-size:42px;font-weight:900}.status{text-align:center;color:#9ba5b5;font-size:13px}.primary,.secondary,.danger{width:100%;margin-top:12px;border:0;border-radius:17px;padding:15px;font-size:14px;font-weight:900}.primary{background:#fff;color:#080a0e}.secondary{background:#202631;color:#fff;border:1px solid #303847}.danger{background:#2b171b;color:#ff9aa8;border:1px solid #58303a}h1{letter-spacing:-1.5px}h2{font-size:19px;margin:26px 0 13px}h3{margin:0 0 5px}.leaders{display:flex;gap:12px;overflow:auto;padding-bottom:5px}.card{min-width:142px;background:#131720;border:1px solid #242b37;border-radius:21px;overflow:hidden;cursor:pointer}.photo{height:112px;background:linear-gradient(160deg,#31405a,#151a24);display:grid;place-items:center;font-size:48px;background-size:cover;background-position:center}.info{padding:12px}.name{font-weight:800}.meta{font-size:11px;color:#8993a3;margin-top:3px}.pts{font-size:22px;font-weight:900;margin-top:8px}.pts span{font-size:10px;color:#8d98aa}.nav{position:fixed;z-index:20;bottom:0;left:50%;transform:translateX(-50%);width:min(430px,100%);height:82px;background:#0c0f15f2;backdrop-filter:blur(16px);border-top:1px solid #242934;display:flex;justify-content:space-around;padding-top:13px}.nav button{border:0;background:none;color:#778294;font-size:9px;font-weight:700}.nav b{display:grid;place-items:center;height:23px;margin-bottom:4px}.nav svg,.pill svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}.nav .active{color:#2282c3}.page{display:none}.page.active{display:block}.modal{position:fixed;z-index:30;inset:0;background:#05070bef;display:none;align-items:flex-end;justify-content:center}.sheet{max-height:90vh;overflow:auto;width:min(430px,100%);background:#151922;border-radius:28px 28px 0 0;padding:24px 18px 34px}.players,.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.p{background:#202631;color:#fff;border:1px solid #303847;border-radius:16px;padding:12px;text-align:center}.p img{width:64px;height:64px;object-fit:cover;border-radius:16px}.face{font-size:35px}.row{display:flex;gap:10px}.row>*{flex:1}input,select{width:100%;padding:14px;margin-top:10px;border-radius:14px;border:1px solid #303847;background:#0f131a;color:#fff;font-size:15px}.statrow,.game,.event,.teamcard{display:flex;align-items:center;gap:12px;padding:13px;background:#131720;border:1px solid #242b37;border-radius:17px;margin-bottom:9px}.teamcard{cursor:pointer;padding:16px}.teamcard .logo{width:58px;height:58px;margin:0}.grow{flex:1}.mini{width:48px;height:48px;border-radius:13px;background:#202837;object-fit:cover;display:grid;place-items:center}.bigstat{font-weight:900;font-size:18px}.empty{color:#8993a3;text-align:center;padding:28px}.profileHero{text-align:center}.profilePic{width:160px;height:160px;border-radius:32px;object-fit:cover;background:#202837;font-size:70px;display:grid;place-items:center;margin:10px auto}.stats4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.stats4 div{text-align:center;background:#131720;border:1px solid #242b37;border-radius:15px;padding:12px 5px}.stats4 b{font-size:22px;display:block}.click{cursor:pointer}.tabs{display:flex;gap:7px;overflow:auto;margin-bottom:12px}.chip{white-space:nowrap;padding:8px 11px;font-size:12px}.chip.active{background:#fff;color:#090b10}.badge{display:inline-block;padding:4px 7px;border-radius:8px;background:#202837;font-size:10px;color:#b9c3d3;margin-left:5px}.goaliegrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}.goaliegrid div{text-align:center;background:#131720;border-radius:14px;padding:10px 4px}.goaliegrid b{display:block;font-size:18px}.timeline{border-left:2px solid #293242;margin-left:8px;padding-left:14px}.fileLabel{display:block;text-align:center}.twoBtns{display:grid;grid-template-columns:1fr 1fr;gap:8px}.twoBtns button{margin-top:10px}.welcome{padding-top:12vh;text-align:center}.welcomeMark{width:92px;height:92px;margin:0 auto 22px;border-radius:30px;background:linear-gradient(145deg,#1c2638,#10141c);display:grid;place-items:center;font-size:44px;border:1px solid #2c3545}.teamChooser{margin-top:26px;text-align:left}.hidden{display:none!important}
/* Goal siren */
.flash{position:fixed;z-index:50;inset:0;background:radial-gradient(circle at 50% 36%,#571015 0,#19090b 38%,#05070b 75%);display:none;place-items:center;text-align:center;overflow:hidden}.sirenWrap{position:relative;width:180px;height:180px;margin:0 auto 18px;display:grid;place-items:center}.sirenGlow{position:absolute;inset:12px;border-radius:50%;background:#ff1e2d;filter:blur(38px);opacity:.62;animation:pulse .35s infinite alternate}.siren{position:relative;font-size:112px;line-height:1;filter:drop-shadow(0 0 18px #ff1f2f);animation:shake .16s infinite}.flash strong{display:block;font-size:54px;letter-spacing:-4px}.flashName{font-size:20px;font-weight:900;margin-top:8px}.flashSub{color:#d9a6aa!important;font-size:13px!important}@keyframes shake{0%{transform:rotate(-7deg) translateX(-2px)}50%{transform:rotate(7deg) translateX(2px)}100%{transform:rotate(-7deg) translateX(-2px)}}@keyframes pulse{from{transform:scale(.8);opacity:.4}to{transform:scale(1.2);opacity:.9}}

.calendar{margin:18px 0;padding:14px;border-radius:20px;background:#111620;border:1px solid #242b37}.calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;text-align:center;font-size:11px}.calday{padding:8px 2px;border-radius:9px;color:#7f8998}.calday.hasgame{background:var(--team);color:#07101b;font-weight:900}.game{background:#1b2230!important;border-color:#3b4658!important;box-shadow:0 8px 22px #0004}.tick{margin:10px 0;padding:12px 14px;border-radius:15px;background:#111720;border:1px solid #273142;border-left:3px solid var(--team)}.tick.pen{border-left-color:#ff5367}.ticktime{font-size:10px;color:#8490a2;font-weight:800;margin-bottom:3px}.colorpick{height:52px;padding:5px}

.settingsSection{margin-top:18px;padding-top:14px;border-top:1px solid #2a3140}.settingsSection:first-child{margin-top:0;padding-top:0;border-top:0}.settingsTitle{font-size:11px;letter-spacing:1.2px;color:#8e99aa;font-weight:900;margin-bottom:6px}.accentRow{display:grid;grid-template-columns:1fr 48px;gap:8px;align-items:center}.accentSave{height:52px;margin-top:10px;border-radius:14px;border:1px solid #303847;background:#202631;color:#fff;font-size:20px;font-weight:900}.calday{min-height:45px;display:flex;flex-direction:column;justify-content:center;align-items:center}.calScore{font-size:9px;margin-top:2px;font-weight:900}.gameState{display:inline-block;font-size:9px;font-weight:900;padding:4px 7px;border-radius:8px;background:#293242;color:#cbd4e2;margin-top:5px}.gameState.live{background:var(--team);color:#07101b}.gameState.done{background:#1c392d;color:#8ff0bd}.sessionBtns{display:grid;grid-template-columns:1fr 1fr;gap:8px}.sessionBtns button{margin-top:12px}.dangerMini{border:1px solid #58303a;background:#2b171b;color:#ff9aa8;border-radius:12px;padding:8px 10px;font-weight:900}

.uploadRow{display:flex;gap:10px;align-items:stretch;margin-top:10px}.uploadRow .fileLabel{flex:1;margin-top:0;display:grid;place-items:center}.uploadThumb{width:54px;height:54px;flex:0 0 54px;border-radius:14px;border:1px solid #303847;background:#0f131a;object-fit:cover;display:grid;place-items:center;color:#687386;font-size:18px;overflow:hidden}
.groupTitle{font-size:11px;letter-spacing:1.3px;color:#8b96a8;font-weight:900;margin:20px 0 8px}.coachCard{cursor:default}
</style></head>
<body><main class="app">
<header class="top"><div class="brand"><img src="icon-192.png" alt="RynqTracker Logo"></div><button class="pill" id="settingsBtn" onclick="openSettings()">⚙︎</button></header>

<section id="welcomePage" class="page">
 <div class="welcome"><div class="welcomeMark"><img src="icon-192.png" style="width:100%;height:100%;object-fit:cover;border-radius:30px"></div><div class="label">DEIN EISHOCKEY TRACKER</div><h1 id="welcomeTitle">Erstelle dein erstes Team</h1><button id="firstTeamBtn" class="primary" onclick="openTeamCreate()">＋ NEUES TEAM ERSTELLEN</button><div class="teamChooser" id="teamChooser"></div></div>
</section>

<section id="homePage" class="page">
 <button class="pill" onclick="showTeamHub()">‹ Teams</button>
 <div class="hero"><div class="label">AKTUELLES SPIEL</div><div class="teamscore"><div class="team"><div class="logo" id="homeLogo"></div><b id="homeTeam"></b></div><div class="score"><span id="homeScore">0</span> : <span id="awayScore">0</span></div><div class="team"><div class="logo">G</div><b id="awayTeam">GEGNER</b></div></div><div class="status" id="gameStatus">Noch kein Spiel gestartet</div><button class="primary" onclick="openGoal()">TOR</button><button class="secondary" onclick="openNewGame()">NEUES SPIEL</button></div>
 <h2>Punkte-Leader</h2><div class="leaders" id="leaders"></div><h2>Letzte Aktion</h2><div class="panel" id="activity">Noch keine Aktion.</div>
</section>
<section id="gamesPage" class="page"><h2>Spiele</h2><div id="calendar"></div><div class="row"><select id="seasonSelect" onchange="setSeason(this.value)"></select><button class="smallbtn" onclick="openSeasonManager()">＋</button></div><button class="primary" onclick="openNewGame()">＋ NEUES SPIEL</button><div id="gamesList" style="margin-top:14px"></div></section>
<section id="trackPage" class="page"><h2>Live-Tracker</h2><div class="panel" id="trackScore"></div><button class="primary" onclick="openGoal()">TOR</button><button class="secondary" onclick="addOpponentGoal()">GEGENTOR</button><button class="secondary" onclick="openShot()">SCHUSS AUFS TOR</button><button class="secondary" onclick="openGoalieEvent()">GOALIE SAVE</button><button class="secondary" onclick="openPenalty()">STRAFE EINTRAGEN</button></section>
<section id="teamPage" class="page"><h2>Mannschaft</h2><button class="secondary" onclick="openTeamEdit()">TEAM BEARBEITEN</button><button class="primary" onclick="openPlayerForm()">＋ SPIELER HINZUFÜGEN</button><div id="teamList" style="margin-top:14px"></div></section>
<section id="statsPage" class="page"><h2>Statistiken</h2><div class="tabs"><button class="chip active" onclick="setStat('p',this)">Punkte</button><button class="chip" onclick="setStat('g',this)">Tore</button><button class="chip" onclick="setStat('a',this)">Assists</button><button class="chip" onclick="setStat('ppg',this)">PPG</button><button class="chip" onclick="setStat('shotpct',this)">Torquote</button><button class="chip" onclick="setStat('pim',this)">Strafmin.</button><button class="chip" onclick="setStat('goalie',this)">Goalies</button></div><div id="statsList"></div></section>
<section id="profilePage" class="page"><button class="pill" onclick="go('team')">‹ Zurück</button><div id="profile"></div></section>
</main>

<nav class="nav" id="nav">
<button data-p="home" class="active" onclick="go('home')"><b><svg viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/></svg></b>HOME</button>
<button data-p="games" onclick="go('games')"><b><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M8 3v4M16 3v4M3 10h18"/></svg></b>SPIELE</button>
<button data-p="track" onclick="go('track')"><b><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg></b>TRACK</button>
<button data-p="team" onclick="go('team')"><b><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3"/><circle cx="17" cy="9" r="2"/><path d="M3 20c0-4 2.7-6 6-6s6 2 6 6M15 15c3 0 5 1.7 5 5"/></svg></b>TEAM</button>
<button data-p="stats" onclick="go('stats')"><b><svg viewBox="0 0 24 24"><path d="M5 20V10M12 20V4M19 20v-7"/></svg></b>STATS</button>
</nav>
<div class="modal" id="modal" onclick="if(event.target===this)closeM()"><div class="sheet" id="sheet"></div></div>
<div class="flash" id="flash"><div><div class="sirenWrap"><div class="sirenGlow"></div><div class="siren">🚨</div></div><strong>TOOOR!</strong><div id="flashName" class="flashName"></div><div id="flashSub" class="meta flashSub"></div></div></div>

<script>
const $=id=>document.getElementById(id), KEY='rynqV5';
const fresh=()=>({version:5,teams:[],activeTeamId:null});
let db;try{db=JSON.parse(localStorage.getItem(KEY))||fresh()}catch(e){db=fresh()}
let bootToHub=true;
let statMode='p',pendingImg='',pendingTeamLogo='',scorer=0,a1=0,strength='EV',editPlayerId=null;
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const team=()=>db.teams.find(t=>t.id===db.activeTeamId)||null;
function save(){localStorage.setItem(KEY,JSON.stringify(db));render()}
function newTeamData(name,short,city,logo,c1,c2){return{id:Date.now()+Math.random(),team:name,teamShort:short,teamCity:city,arena:'',coach:'',opponents:[],teamLogo:logo||'',teamColors:{primary:c1,secondary:c2},players:[],seasons:[{id:'season-'+Date.now(),name:'2026/27'}],activeSeason:null,games:[],current:null,activity:'Noch keine Aktion.'}}
function showTeamHub(){db.activeTeamId=null;localStorage.setItem(KEY,JSON.stringify(db));render()}
function selectTeam(id){db.activeTeamId=id;localStorage.setItem(KEY,JSON.stringify(db));go('home')}
function renderHub(){let has=db.teams.length>0;$('welcomeTitle').textContent=has?'Deine Teams':'Erstelle dein erstes Team';$('firstTeamBtn').classList.toggle('hidden',has);$('teamChooser').innerHTML=has?`${db.teams.map(t=>`<div class="teamcard" onclick="selectTeam(${t.id})"><div class="logo">${t.teamLogo?`<img src="${t.teamLogo}">`:esc(t.teamShort)}</div><div class="grow"><b>${esc(t.team)}</b><div class="meta">${esc(t.teamCity||'')} · ${t.players.length} Spieler</div></div><b>›</b></div>`).join('')}<button class="secondary" onclick="openTeamCreate()">＋ WEITERES TEAM HINZUFÜGEN</button>`:''}
function render(){if(bootToHub){bootToHub=false;db.activeTeamId=null}let t=team();if(t){t.arena=t.arena||'';t.coach=t.coach||'';t.opponents=t.opponents||[];t.players.forEach(p=>{p.shots=p.shots||0;p.pim=p.pim||0});t.games.forEach(g=>{if(g.started===undefined){g.started=t.current?.id===g.id;g.finished=!g.started;g.decision=g.decision||''}});}if(!t){document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));$('welcomePage').classList.add('active');$('nav').classList.add('hidden');$('settingsBtn').classList.add('hidden');document.documentElement.style.setProperty('--team','#2282c3');renderHub();return}
 $('nav').classList.remove('hidden');$('settingsBtn').classList.remove('hidden');document.documentElement.style.setProperty('--team',t.teamColors?.primary||'#2282c3');
 if(!t.activeSeason&&t.seasons[0])t.activeSeason=t.seasons[0].id;
 $('homeTeam').textContent=t.teamShort;$('homeLogo').innerHTML=t.teamLogo?`<img src="${t.teamLogo}">`:esc(t.teamShort);
 let c=t.current;$('homeScore').textContent=c?.hs||0;$('awayScore').textContent=c?.as||0;$('awayTeam').textContent=c?.opponent||'GEGNER';$('gameStatus').textContent=c?`${c.date} · ${seasonName(t.activeSeason)}`:'Noch kein Spiel gestartet';$('activity').textContent=t.activity||'Noch keine Aktion.';
 let leaders=t.players.filter(p=>p.pos!=='G').sort((a,b)=>(b.g+b.a)-(a.g+a.a)).slice(0,5);$('leaders').innerHTML=leaders.length?leaders.map(p=>`<div class="card" onclick="profile(${p.id})"><div class="photo" ${p.img?`style="background-image:url('${p.img}')"`:''}>${p.img?'':p.pos==='G'?'🥅':'🏒'}</div><div class="info"><div class="name">#${p.no} ${esc(p.n)}</div><div class="meta">${p.pos}</div><div class="pts">${p.g+p.a} <span>PUNKTE</span></div></div></div>`).join(''):'<div class="empty">Füge deine ersten Spieler hinzu.</div>';
 let playerRow=p=>`<div class="statrow click" onclick="profile(${p.id})">${p.img?`<img class="mini" src="${p.img}">`:`<div class="mini">${p.pos==='G'?'🥅':'🏒'}</div>`}<div class="grow"><b>#${p.no} ${esc(p.n)}</b><div class="meta">${p.pos} <span class="badge">${p.status}</span></div></div><div class="bigstat">${p.g+p.a} P</div></div>`;let groups=[['TORHÜTER',t.players.filter(p=>p.pos==='G')],['VERTEIDIGER',t.players.filter(p=>p.pos==='D')],['STÜRMER',t.players.filter(p=>!['G','D'].includes(p.pos))]];$('teamList').innerHTML=groups.map(([n,ps])=>`<div class="groupTitle">${n}</div>${ps.length?ps.map(playerRow).join(''):'<div class="meta">Keine</div>'}`).join('')+`<div class="groupTitle">COACH</div>${t.coach?`<div class="statrow coachCard"><div class="mini">👔</div><div class="grow"><b>${esc(t.coach)}</b><div class="meta">Head Coach</div></div></div>`:'<div class="meta">Kein Coach eingetragen.</div>'}`;
 $('seasonSelect').innerHTML=t.seasons.map(s=>`<option value="${s.id}" ${s.id===t.activeSeason?'selected':''}>${esc(s.name)}</option>`).join('');
 let games=t.games.filter(g=>g.season===t.activeSeason);$('gamesList').innerHTML=games.length?games.slice().reverse().map(g=>`<div class="game"><div class="grow click" onclick="gameDetail(${g.id})"><b>${esc(t.teamShort)} ${g.started||g.finished?g.hs+':'+g.as:'– : –'} ${esc(g.opponent)}</b><div class="meta">${g.date}</div><span class="gameState ${g.finished?'done':g.started?'live':''}">${g.finished?'BEENDET'+(g.decision?' · '+g.decision:''):g.started?'LÄUFT':'GEPLANT'}</span></div><button class="dangerMini" onclick="deleteGame(${g.id})">×</button></div>`).join(''):'<div class="empty">Noch keine Spiele in dieser Saison.</div>';
 drawCalendar();$('trackScore').innerHTML=c?`<div class="label">LIVE</div><h1>${esc(t.teamShort)} ${c.hs} : ${c.as} ${esc(c.opponent)}</h1><div class="meta">${c.date}</div>`:'<div class="empty">Starte zuerst ein Spiel.</div>';renderStats()
}
function go(p){if(!team())return render();document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));$(p+'Page').classList.add('active');document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.p===p));render()}
function modal(h){$('sheet').innerHTML=h;$('modal').style.display='flex'}function closeM(){$('modal').style.display='none'}
function openTeamCreate(){pendingTeamLogo='';modal(`<h3>Neues Team erstellen</h3><input id="tn" placeholder="Teamname"><div class="row"><input id="ts" maxlength="5" placeholder="Kürzel"><input id="tc" placeholder="Standort / Stadt"></div><input id="arena" placeholder="Eishalle"><input id="coach" placeholder="Trainer / Head Coach"><div class="row"><div><div class="meta">Primärfarbe</div><input id="c1" type="color" value="#2282c3"></div><div><div class="meta">Sekundärfarbe</div><input id="c2" type="color" value="#ffffff"></div></div><div class="uploadRow"><label class="secondary fileLabel">TEAMLOGO AUSWÄHLEN<input type="file" accept="image/*" style="display:none" onchange="previewTeamLogo(this)"></label><div id="teamPreview" class="uploadThumb">＋</div></div><button class="primary" onclick="createTeam()">TEAM ERSTELLEN</button><button class="secondary" onclick="closeM()">Abbrechen</button>`)}
function previewTeamLogo(inp){let f=inp.files[0];if(!f)return;let r=new FileReader();r.onload=e=>{pendingTeamLogo=e.target.result;$('teamPreview').innerHTML=`<img src="${pendingTeamLogo}" style="width:100%;height:100%;object-fit:cover">`};r.readAsDataURL(f)}
function createTeam(){let n=$('tn').value.trim();if(!n)return alert('Bitte Teamname eingeben.');let s=($('ts').value.trim()||n.slice(0,3)).toUpperCase();let t=newTeamData(n,s,$('tc').value.trim(),pendingTeamLogo,$('c1').value,$('c2').value);t.arena=$('arena')?.value.trim()||'';t.coach=$('coach')?.value.trim()||'';t.activeSeason=t.seasons[0].id;db.teams.push(t);db.activeTeamId=t.id;pendingTeamLogo='';closeM();save();go('home')}
function openTeamEdit(){let t=team();pendingTeamLogo=t.teamLogo||'';modal(`<h3>Team bearbeiten</h3><input id="tn" value="${esc(t.team)}"><div class="row"><input id="ts" maxlength="5" value="${esc(t.teamShort)}"><input id="tc" value="${esc(t.teamCity||'')}"></div><input id="arena" value="${esc(t.arena||'')}" placeholder="Eishalle"><input id="coach" value="${esc(t.coach||'')}" placeholder="Trainer / Head Coach"><div class="row"><input id="c1" type="color" value="${t.teamColors.primary}"><input id="c2" type="color" value="${t.teamColors.secondary}"></div><div class="uploadRow"><label class="secondary fileLabel">TEAMLOGO ÄNDERN<input type="file" accept="image/*" style="display:none" onchange="previewTeamLogo(this)"></label><div id="teamPreview" class="uploadThumb">${pendingTeamLogo?`<img src="${pendingTeamLogo}" style="width:100%;height:100%;object-fit:cover">`:'＋'}</div></div><button class="primary" onclick="saveTeamEdit()">SPEICHERN</button><button class="danger" onclick="deleteTeam()">TEAM LÖSCHEN</button><button class="secondary" onclick="closeM()">Abbrechen</button>`)}
function saveTeamEdit(){let t=team();t.team=$('tn').value.trim()||t.team;t.teamShort=($('ts').value.trim()||t.teamShort).toUpperCase();t.teamCity=$('tc').value.trim();t.arena=$('arena')?.value.trim()||'';t.coach=$('coach')?.value.trim()||'';t.teamLogo=pendingTeamLogo;t.teamColors={primary:$('c1').value,secondary:$('c2').value};closeM();save()}
function deleteTeam(){let t=team();if(confirm(`„${t.team}“ wirklich löschen?`)){db.teams=db.teams.filter(x=>x.id!==t.id);db.activeTeamId=null;closeM();save()}}
function posOptions(sel='C'){return ['C','LW','RW','D','G'].map(x=>`<option ${x===sel?'selected':''}>${x}</option>`).join('')}function statusOptions(sel='Aktiv'){return ['Aktiv','Verletzt','Inaktiv'].map(x=>`<option ${x===sel?'selected':''}>${x}</option>`).join('')}
function openPlayerForm(){pendingImg='';modal(`<h3>Spieler hinzufügen</h3><input id="pn" placeholder="Name"><div class="row"><input id="pno" type="number" placeholder="Nr."><select id="pp">${posOptions()}</select></div><select id="pst">${statusOptions()}</select><div class="uploadRow"><label class="secondary fileLabel">SPIELERBILD AUSWÄHLEN<input type="file" accept="image/*" style="display:none" onchange="previewFile(this)"></label><div id="preview" class="uploadThumb">＋</div></div><button class="primary" onclick="addPlayer()">SPEICHERN</button><button class="secondary" onclick="closeM()">Abbrechen</button>`)}
function previewFile(inp){let f=inp.files[0];if(!f)return;let r=new FileReader();r.onload=e=>{pendingImg=e.target.result;$('preview').innerHTML=`<img src="${pendingImg}" style="width:100%;height:100%;object-fit:cover">`};r.readAsDataURL(f)}
function addPlayer(){let t=team(),n=$('pn').value.trim();if(!n)return;t.players.push({id:Date.now()+Math.random(),n,no:+$('pno').value||0,pos:$('pp').value,status:$('pst').value,g:0,a:0,gp:0,shots:0,pim:0,img:pendingImg,goalie:{saves:0,ga:0,w:0,l:0,so:0}});pendingImg='';closeM();save()}
function openPlayerEdit(id){let t=team(),x=t.players.find(p=>p.id===id);editPlayerId=id;pendingImg=x.img||'';modal(`<h3>Spieler bearbeiten</h3><input id="pn" value="${esc(x.n)}"><div class="row"><input id="pno" type="number" value="${x.no}"><select id="pp">${posOptions(x.pos)}</select></div><select id="pst">${statusOptions(x.status)}</select><div class="uploadRow"><label class="secondary fileLabel">SPIELERBILD ÄNDERN<input type="file" accept="image/*" style="display:none" onchange="previewFile(this)"></label><div id="preview" class="uploadThumb">${pendingImg?`<img src="${pendingImg}" style="width:100%;height:100%;object-fit:cover">`:'＋'}</div></div><button class="primary" onclick="savePlayerEdit()">SPEICHERN</button><button class="secondary" onclick="closeM()">Abbrechen</button>`)}
function savePlayerEdit(){let x=team().players.find(p=>p.id===editPlayerId);x.n=$('pn').value.trim()||x.n;x.no=+$('pno').value||0;x.pos=$('pp').value;x.status=$('pst').value;x.img=pendingImg;closeM();save();profile(x.id)}
function removePlayer(id){if(confirm('Spieler wirklich löschen?')){team().players=team().players.filter(x=>x.id!==id);save();go('team')}}
function seasonName(id){return team()?.seasons.find(s=>s.id===id)?.name||''}
function openNewGame(){let t=team();let opts=(t.opponents||[]).map(o=>`<option value="${esc(o)}"></option>`).join('');modal(`<h3>Neues Spiel</h3><input id="opp" list="opponents" placeholder="Gegner"><datalist id="opponents">${opts}</datalist><input id="date" type="date" value="${new Date().toISOString().slice(0,10)}"><button class="primary" onclick="startGame()">SPIEL STARTEN</button><button class="secondary" onclick="closeM()">Abbrechen</button>`)}
function startGame(){let t=team(),o=$('opp').value.trim();if(!o)return;t.opponents=t.opponents||[];if(!t.opponents.includes(o))t.opponents.push(o);let g={id:Date.now(),opponent:o,date:$('date').value,hs:0,as:0,season:t.activeSeason,events:[],started:false,finished:false,decision:''};t.games.push(g);t.activity='Spiel gegen '+o+' angelegt.';closeM();save();gameDetail(g.id)}
function beginGame(id){let t=team(),g=t.games.find(x=>x.id===id);if(!g||g.started)return;g.started=true;g.startedAt=Date.now();t.current=g;t.players.filter(p=>p.status==='Aktiv').forEach(p=>p.gp++);t.activity='Spiel gegen '+g.opponent+' gestartet.';closeM();save();go('track')}
function chooseEndGame(id){let g=team().games.find(x=>x.id===id);if(!g)return;modal(`<h3>Spiel beenden</h3><div class="meta">Wie wurde das Spiel entschieden?</div><button class="primary" onclick="endGame(${id},'REG')">REGULÄRE SPIELZEIT</button><button class="secondary" onclick="endGame(${id},'OT')">OVERTIME</button><button class="secondary" onclick="endGame(${id},'SO')">PENALTY-SCHIESSEN</button><button class="secondary" onclick="closeM()">Abbrechen</button>`)}
function endGame(id,decision){let t=team(),g=t.games.find(x=>x.id===id);if(!g)return;g.started=true;g.finished=true;g.decision=decision;g.finishedAt=Date.now();if(t.current?.id===id)t.current=null;t.activity=`Spiel beendet · ${g.hs}:${g.as}${decision==='OT'?' n.V.':decision==='SO'?' n.P.':''}`;closeM();save();go('games')}
function playerButtons(action,exclude=[]){let t=team();let ps=t.players.filter(p=>p.status==='Aktiv'&&p.pos!=='G'&&!exclude.includes(p.id));return `<div class="players">${ps.map(p=>`<button class="p" onclick="${action}(${p.id})">${p.img?`<img src="${p.img}">`:`<div class="face">🏒</div>`}<b>#${p.no}</b><div>${esc(p.n)}</div></button>`).join('')}</div>`}
function openGoal(){let t=team();if(!t.current)t.current=t.games.find(g=>g.started&&!g.finished)||null;if(!t.current||!t.current.started||t.current.finished){alert('Starte zuerst ein Spiel.');return}let ps=t.players.filter(p=>p.status==='Aktiv'&&p.pos!=='G');if(!ps.length){alert('Füge zuerst einen aktiven Feldspieler hinzu.');return}modal(`<h3>Torschütze</h3><div class="players">${ps.map(p=>`<button class="p" onclick="pickScorer(${p.id})">${p.img?`<img src="${p.img}">`:`<div class="face">🏒</div>`}<b>#${p.no}</b><div>${esc(p.n)}</div></button>`).join('')}</div><button class="secondary" onclick="closeM()">Abbrechen</button>`)}
function pickScorer(id){scorer=id;modal(`<h3>Tor-Art</h3><div class="grid"><button class="p" onclick="pickStrength('EV')">5 gegen 5</button><button class="p" onclick="pickStrength('PP')">Powerplay</button><button class="p" onclick="pickStrength('SH')">Unterzahl</button><button class="p" onclick="pickStrength('EN')">Empty Net</button><button class="p" onclick="pickStrength('PS')">Penalty Shot</button></div>`)}
function pickStrength(s){strength=s;modal(`<h3>1. Assist</h3>${playerButtons('pickA1',[scorer])}<button class="secondary" onclick="pickA1(0)">Kein Assist</button>`)}
function pickA1(id){a1=id;modal(`<h3>2. Assist</h3>${playerButtons('finishGoal',[scorer,id].filter(Boolean))}<button class="secondary" onclick="finishGoal(0)">Kein 2. Assist</button>`)}
function finishGoal(a2){let t=team(),s=t.players.find(x=>x.id===scorer);s.g++;s.shots=(s.shots||0)+1;[a1,a2].filter(Boolean).forEach(id=>{let p=t.players.find(x=>x.id===id);if(p)p.a++});t.current.hs++;t.current.events.push({type:'goal',scorer,a1,a2,strength,time:Date.now()});let ass=[a1,a2].filter(Boolean).map(id=>t.players.find(x=>x.id===id)?.n).filter(Boolean);t.activity=`Tor: #${s.no} ${s.n}`+(ass.length?' · Assists: '+ass.join(', '):'')+' · '+strength;closeM();save();$('flashName').textContent='#'+s.no+' '+s.n;$('flashSub').textContent=s.g+'. Saisontor · '+strength;$('flash').style.display='grid';setTimeout(()=>$('flash').style.display='none',1900)}
function addOpponentGoal(){let t=team();if(!t.current||!t.current.started||t.current.finished)return alert('Starte zuerst ein Spiel.');t.current.as++;t.current.events.push({type:'oppgoal',time:Date.now()});t.players.filter(p=>p.pos==='G'&&p.status==='Aktiv').forEach(p=>p.goalie.ga++);t.activity='Gegentor eingetragen.';save()}
function openGoalieEvent(){let t=team();if(!t.current||!t.current.started||t.current.finished)return alert('Starte zuerst ein Spiel.');let gs=t.players.filter(p=>p.pos==='G'&&p.status==='Aktiv');if(!gs.length)return alert('Füge zuerst einen aktiven Torhüter hinzu.');modal(`<h3>Goalie-Statistik</h3>${gs.map(g=>`<button class="secondary" onclick="goalieSave(${g.id})">SAVE · #${g.no} ${esc(g.n)}</button>`).join('')}`)}
function goalieSave(id){let t=team(),p=t.players.find(x=>x.id===id);p.goalie.saves++;t.current.events.push({type:'save',goalie:id,time:Date.now()});t.activity='Save: '+p.n;closeM();save()}
function savePct(x){let shots=x.goalie.saves+x.goalie.ga;return shots?x.goalie.saves/shots:0}
function setStat(m,b){statMode=m;if(b){document.querySelectorAll('.tabs .chip').forEach(x=>x.classList.remove('active'));b.classList.add('active')}renderStats()}
function renderStats(){let t=team();if(!t)return;let ps=[...t.players];if(statMode==='goalie')ps=ps.filter(p=>p.pos==='G').sort((a,b)=>savePct(b)-savePct(a));else{if(['p','ppg','shotpct'].includes(statMode))ps=ps.filter(p=>p.pos!=='G');ps.sort((a,b)=>statVal(b)-statVal(a))}$('statsList').innerHTML=ps.length?ps.map((p,i)=>`<div class="statrow click" onclick="profile(${p.id})"><b>${i+1}.</b>${p.img?`<img class="mini" src="${p.img}">`:`<div class="mini">${p.pos==='G'?'🥅':'🏒'}</div>`}<div class="grow"><b>${esc(p.n)}</b><div class="meta">#${p.no} · ${p.pos}</div></div><div class="bigstat">${statMode==='goalie'?(savePct(p)*100).toFixed(1)+'%':statVal(p)}</div></div>`).join(''):'<div class="empty">Noch keine Daten.</div>'}
function statVal(p){if(statMode==='g')return p.g;if(statMode==='a')return p.a;if(statMode==='ppg')return p.gp?((p.g+p.a)/p.gp).toFixed(2):'0.00';if(statMode==='shotpct')return (p.shots||0)?((p.g/(p.shots||1))*100).toFixed(1)+'%':'0.0%';if(statMode==='pim')return p.pim||0;return p.g+p.a}
function playerEvents(id){let t=team(),a=[];t.games.forEach(g=>g.events.filter(e=>e.type==='goal'&&(e.scorer===id||e.a1===id||e.a2===id)).forEach(e=>a.push({...e,game:g})));return a.reverse()}
function profile(id){let t=team(),x=t.players.find(p=>p.id===id);if(!x)return;go('profile');let ev=playerEvents(id).slice(0,5);let goalie=x.pos==='G'?`<h2>Torhüter-Stats</h2><div class="goaliegrid"><div><b>${x.goalie.saves}</b>Saves</div><div><b>${(savePct(x)*100).toFixed(1)}%</b>SV%</div><div><b>${x.goalie.ga}</b>GA</div><div><b>${x.goalie.w}</b>Siege</div><div><b>${x.goalie.l}</b>Niederl.</div><div><b>${x.goalie.so}</b>Shutouts</div></div>`:'';$('profile').innerHTML=`<div class="profileHero">${x.img?`<img class="profilePic" src="${x.img}">`:`<div class="profilePic">${x.pos==='G'?'🥅':'🏒'}</div>`}<h1>#${x.no} ${esc(x.n)}</h1><div class="meta">${x.pos} · ${x.status}</div></div><div class="stats4"><div><b>${x.gp}</b>SP</div><div><b>${x.g}</b>T</div><div><b>${x.a}</b>A</div><div><b>${x.g+x.a}</b>P</div></div>${goalie}<h2>Letzte Scorerpunkte</h2>${ev.length?ev.map(e=>`<div class="event"><div class="grow"><b>${e.scorer===id?'Tor':'Assist'}</b><div class="meta">${e.game.date} · vs. ${esc(e.game.opponent)}</div></div></div>`).join(''):'<div class="empty">Noch keine Scorerpunkte.</div>'}<button class="primary" onclick="openPlayerEdit(${x.id})">SPIELER BEARBEITEN</button><button class="danger" onclick="removePlayer(${x.id})">Spieler löschen</button>`}
function gameDetail(id){let t=team(),g=t.games.find(x=>x.id===id);if(!g)return;modal(`<div class="label">SCORESHEET</div><h3>${esc(t.teamShort)} ${g.started||g.finished?g.hs+':'+g.as:'– : –'} ${esc(g.opponent)}</h3><div class="meta">${g.date}${g.finished&&g.decision?' · '+(g.decision==='OT'?'nach Overtime':g.decision==='SO'?'nach Penalty-Schießen':'regulär'):''}</div><div style="margin-top:16px">${scoreSheet(g)||'<div class="empty">Noch keine Ereignisse.</div>'}</div>${!g.started?`<button class="primary" onclick="beginGame(${g.id})">▶ SPIEL STARTEN</button>`:''}${g.started&&!g.finished?`<button class="primary" onclick="chooseEndGame(${g.id})">■ SPIEL BEENDEN</button>`:''}<button class="danger" onclick="deleteGame(${g.id})">SPIEL LÖSCHEN</button><button class="secondary" onclick="closeM()">Schließen</button>`)}

function deleteGame(id){let t=team(),g=t.games.find(x=>x.id===id);if(!g)return;if(!confirm('Dieses Spiel wirklich löschen?'))return;if(g.started){t.players.filter(p=>p.status==='Aktiv').forEach(p=>p.gp=Math.max(0,(p.gp||0)-1));(g.events||[]).forEach(e=>{if(e.type==='goal'){let s=t.players.find(p=>p.id===e.scorer);if(s){s.g=Math.max(0,s.g-1);s.shots=Math.max(0,(s.shots||0)-1)};[e.a1,e.a2].filter(Boolean).forEach(a=>{let p=t.players.find(x=>x.id===a);if(p)p.a=Math.max(0,p.a-1)})}if(e.type==='shot'){let p=t.players.find(x=>x.id===e.player);if(p)p.shots=Math.max(0,(p.shots||0)-1)}if(e.type==='penalty'&&e.player){let p=t.players.find(x=>x.id===e.player);if(p)p.pim=Math.max(0,(p.pim||0)-(e.minutes||0))}if(e.type==='save'){let p=t.players.find(x=>x.id===e.goalie);if(p)p.goalie.saves=Math.max(0,p.goalie.saves-1)}if(e.type==='oppgoal')t.players.filter(p=>p.pos==='G'&&p.status==='Aktiv').forEach(p=>p.goalie.ga=Math.max(0,p.goalie.ga-1))})}if(t.current?.id===id)t.current=null;t.games=t.games.filter(x=>x.id!==id);closeM();save()}

function openSeasonManager(){let t=team();modal(`<h3>Saisonen</h3>${t.seasons.map(s=>`<button class="secondary" onclick="setSeason('${s.id}');closeM()">${esc(s.name)}${s.id===t.activeSeason?' ✓':''}</button>`).join('')}<input id="newSeason" placeholder="z. B. 2027/28"><button class="primary" onclick="addSeason()">SAISON HINZUFÜGEN</button><button class="secondary" onclick="closeM()">Schließen</button>`)}
function addSeason(){let t=team(),n=$('newSeason').value.trim();if(!n)return;let id='season-'+Date.now();t.seasons.push({id,name:n});t.activeSeason=id;closeM();save()}function setSeason(id){team().activeSeason=id;save()}
function openSettings(){let t=team();modal(`<h3>Einstellungen</h3><div class="settingsSection"><div class="settingsTitle">DARSTELLUNG</div><div class="meta">Akzentfarbe</div><div class="accentRow"><input id="accent" class="colorpick" type="color" value="${t.teamColors?.primary||'#2282c3'}"><button class="accentSave" onclick="saveAccent()">✓</button></div></div><div class="settingsSection"><div class="settingsTitle">TEAM & SAISON</div><button class="secondary" onclick="showTeamHub();closeM()">TEAM WECHSELN / NEUES TEAM</button><button class="secondary" onclick="openTeamEdit()">TEAM BEARBEITEN</button><button class="secondary" onclick="openOpponentDB()">GEGNER-DATENBANK</button><button class="secondary" onclick="openSeasonManager()">SAISONS VERWALTEN</button></div><div class="settingsSection"><div class="settingsTitle">DATEN</div><button class="danger" onclick="resetAllData()">ALLE DATEN LÖSCHEN</button></div><button class="secondary" onclick="closeM()">Schließen</button>`)}
function saveAccent(){let t=team(),v=$('accent').value;t.teamColors=t.teamColors||{};t.teamColors.primary=v;save();let b=document.querySelector('.accentSave');if(b){b.textContent='✓';b.style.background='var(--team)';setTimeout(()=>b.style.background='',700)}}
function resetAllData(){if(!confirm('Wirklich alle RynqTracker-Daten löschen? Dieser Schritt kann nicht rückgängig gemacht werden.'))return;if(!confirm('Letzte Bestätigung: Komplett von vorne anfangen?'))return;localStorage.removeItem(KEY);db={version:5,teams:[],activeTeamId:null};closeM();showTeamHub();render()}
function exportBackup(){let blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='RynqTracker-Backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();URL.revokeObjectURL(a.href);closeM()}
function importBackup(inp){let f=inp.files[0];if(!f)return;let r=new FileReader();r.onload=e=>{try{let x=JSON.parse(e.target.result);if(!Array.isArray(x.teams))throw Error();if(confirm('Aktuelle RynqTracker-Daten durch dieses Backup ersetzen?')){db=x;closeM();save()}}catch(err){alert('Backup konnte nicht gelesen werden.')}};r.readAsText(f)}

function openOpponentDB(){let t=team();t.opponents=t.opponents||[];modal(`<h3>Gegner-Datenbank</h3>${t.opponents.length?t.opponents.map((o,i)=>`<div class="statrow"><div class="grow"><b>${esc(o)}</b></div><button class="smallbtn" onclick="removeOpp(${i})">×</button></div>`).join(''):'<div class="empty">Noch keine Gegner gespeichert.</div>'}<input id="newOpp" placeholder="Gegnerteam"><button class="primary" onclick="addOpp()">HINZUFÜGEN</button><button class="secondary" onclick="closeM()">Schließen</button>`)}
function addOpp(){let t=team(),o=$('newOpp').value.trim();if(o&&!t.opponents.includes(o))t.opponents.push(o);save();openOpponentDB()}
function removeOpp(i){team().opponents.splice(i,1);save();openOpponentDB()}
function openShot(){let t=team();if(!t.current||!t.current.started||t.current.finished)return alert('Starte zuerst ein Spiel.');let ps=t.players.filter(p=>p.status==='Aktiv'&&p.pos!=='G');modal(`<h3>Schuss von …</h3><div class="players">${ps.map(p=>`<button class="p" onclick="addShot(${p.id})"><b>#${p.no}</b><div>${esc(p.n)}</div></button>`).join('')}</div><button class="secondary" onclick="closeM()">Abbrechen</button>`)}
function addShot(id){let t=team(),p=t.players.find(x=>x.id===id);p.shots=(p.shots||0)+1;t.current.events.push({type:'shot',player:id,time:Date.now()});t.activity='Schuss: '+p.n;closeM();save()}
function openPenalty(){let t=team();if(!t.current||!t.current.started||t.current.finished)return alert('Starte zuerst ein Spiel.');let reasons=['Beinstellen','Haken','Halten','Stockschlag','Hoher Stock','Behinderung','Bandencheck','Check gegen Kopf/Nacken','Check von hinten','Übertriebene Härte','Cross-Check','Ellbogencheck','Kniecheck','Charging / Unerlaubter Körperangriff','Spielverzögerung','Zu viele Spieler auf dem Eis','Unsportliches Verhalten','Disziplinarstrafe','Kampf / Fighting','Spearing','Butt-Ending','Kicking','Leaving the Bench','Penalty Shot / Regelverstoß'];modal(`<h3>Strafe</h3><select id="penp"><option value="opp">${esc(t.current.opponent)}</option>${t.players.filter(p=>p.status==='Aktiv').map(p=>`<option value="${p.id}">#${p.no} ${esc(p.n)}</option>`).join('')}</select><select id="penm"><option value="2">2 Minuten</option><option value="4">2+2 Minuten</option><option value="5">5 Minuten</option><option value="10">10 Minuten</option><option value="20">20 Minuten / Spieldauer</option></select><select id="penr">${reasons.map(r=>`<option value="${r}">${r}</option>`).join('')}</select><button class="primary" onclick="addPenalty()">SPEICHERN</button><button class="secondary" onclick="closeM()">Abbrechen</button>`)}
function addPenalty(){let t=team(),v=$('penp').value,m=+$('penm').value,r=$('penr').value,pid=v==='opp'?null:+v;if(pid){let p=t.players.find(x=>x.id===pid);p.pim=(p.pim||0)+m}t.current.events.push({type:'penalty',player:pid,minutes:m,reason:r,time:Date.now()});t.activity=`${m} Min. · ${r}`;closeM();save()}
function tickTime(e){return new Date(e.time).toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'})}
function scoreSheet(g){let t=team();return (g.events||[]).slice().reverse().map(e=>{if(e.type==='goal'){let s=t.players.find(p=>p.id===e.scorer),a=[e.a1,e.a2].filter(Boolean).map(id=>t.players.find(p=>p.id===id)?.n).filter(Boolean);return `<div class="tick"><div class="ticktime">${tickTime(e)} · TOR · ${e.strength||''}</div><b>#${s?.no||''} ${esc(s?.n||'Spieler')}</b><div class="meta">${a.length?'Assists: '+a.map(esc).join(', '):'Ohne Assist'}</div></div>`}if(e.type==='oppgoal')return `<div class="tick"><div class="ticktime">${tickTime(e)} · GEGENTOR</div><b>${esc(g.opponent)}</b></div>`;if(e.type==='penalty'){let p=e.player?t.players.find(x=>x.id===e.player):null;return `<div class="tick pen"><div class="ticktime">${tickTime(e)} · ${e.minutes} MIN STRAFE</div><b>${p?esc(p.n):esc(g.opponent)}</b><div class="meta">${esc(e.reason)}</div></div>`}if(e.type==='save'){let p=t.players.find(x=>x.id===e.goalie);return `<div class="tick"><div class="ticktime">${tickTime(e)} · SAVE</div><b>${esc(p?.n||'Goalie')}</b></div>`}return ''}).join('')}
function drawCalendar(){let box=$('calendar'),t=team();if(!box||!t)return;let now=new Date(),y=now.getFullYear(),m=now.getMonth(),days=new Date(y,m+1,0).getDate(),off=(new Date(y,m,1).getDay()+6)%7,monthGames=t.games.filter(g=>g.season===t.activeSeason).filter(g=>{let d=new Date(g.date+'T12:00:00');return d.getFullYear()===y&&d.getMonth()===m}),byDay={};monthGames.forEach(g=>(byDay[+g.date.slice(-2)]??=[]).push(g));let cells='';for(let i=0;i<off;i++)cells+='<div></div>';for(let d=1;d<=days;d++){let gs=byDay[d]||[],done=gs.filter(g=>g.finished);cells+=`<div class="calday ${gs.length?'hasgame':''}"><span>${d}</span>${done.map(g=>`<span class="calScore">${g.hs}:${g.as}${g.decision==='OT'?' OT':g.decision==='SO'?' SO':''}</span>`).join('')}</div>`}box.innerHTML=`<div class="calendar"><b>${now.toLocaleDateString('de-DE',{month:'long',year:'numeric'})}</b><div class="calgrid" style="margin-top:12px">${['Mo','Di','Mi','Do','Fr','Sa','So'].map(x=>`<b>${x}</b>`).join('')}${cells}</div></div>`}

if('serviceWorker' in navigator)navigator.serviceWorker.register('./sw.js');
render();
</script></body></html>
