<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#090b10"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="RynqTracker"><link rel="apple-touch-icon" href="apple-touch-icon.png"><link rel="manifest" href="manifest.webmanifest"><title>RynqTracker</title><style>
:root{--a:#68a4ff;--a2:#234a80;--bg:#090b10;--card:#131720;--line:#27303d;--muted:#8e99aa}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{max-width:430px;margin:auto;min-height:100vh;padding:20px 17px 104px}.top{display:flex;align-items:center;justify-content:space-between}.brand{display:flex;align-items:center;gap:9px;font-size:22px;font-weight:900}.appLogo{width:34px;height:34px;border-radius:10px;object-fit:cover}.pill,.small,.chip{border:1px solid var(--line);background:#151a23;color:#fff;border-radius:14px;padding:9px 12px;font-weight:800}.page{display:none}.page.active{display:block}h1{letter-spacing:-1.5px}h2{font-size:19px;margin:24px 0 12px}.meta{font-size:12px;color:var(--muted)}.label{font-size:10px;letter-spacing:1.4px;color:var(--muted);font-weight:900}.panel,.hero,.teamcard,.game,.statrow,.event,.coach{background:linear-gradient(145deg,#171c26,#0e1118);border:1px solid var(--line);border-radius:22px}.panel,.hero{padding:18px;margin-top:16px}.primary,.secondary,.danger{width:100%;border:0;border-radius:16px;padding:15px;margin-top:11px;font-weight:900}.primary{background:var(--a);color:#fff}.secondary{background:#202631;color:#fff;border:1px solid #303847}.danger{background:#2b171b;color:#ff9aa8;border:1px solid #58303a}.welcome{text-align:center;padding-top:6vh}.welcomeLogo{width:122px;height:122px;border-radius:32px;object-fit:cover;box-shadow:0 15px 45px #0008;margin-bottom:15px}.teamChooser{text-align:left;margin-top:28px}.teamcard,.game,.statrow,.event,.coach{display:flex;align-items:center;gap:12px;padding:13px;margin-bottom:9px}.teamcard{cursor:pointer}.logo,.mini{width:54px;height:54px;border-radius:15px;background:#202837;display:grid;place-items:center;font-weight:900;overflow:hidden}.logo img,.mini img,img.mini{width:100%;height:100%;object-fit:cover}.grow{flex:1}.nav{position:fixed;z-index:20;bottom:0;left:50%;transform:translateX(-50%);width:min(430px,100%);height:82px;background:#0c0f15f2;backdrop-filter:blur(18px);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding-top:12px}.nav button{border:0;background:none;color:#778294;font-size:9px;font-weight:800}.nav b{display:block;font-size:20px;margin-bottom:3px}.nav .active{color:var(--a)}.hidden{display:none!important}.teamscore{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;margin:15px 0}.team{text-align:center}.score{font-size:39px;font-weight:950}.leaders{display:flex;gap:10px;overflow:auto}.leader{min-width:135px;padding:13px;background:#131720;border:1px solid var(--line);border-radius:18px}.leader b{font-size:19px}.row{display:flex;gap:9px}.row>*{flex:1}input,select{width:100%;padding:13px;margin-top:9px;border-radius:13px;border:1px solid #303847;background:#0f131a;color:#fff;font-size:15px}.modal{position:fixed;z-index:40;inset:0;background:#05070bef;display:none;align-items:flex-end;justify-content:center}.sheet{max-height:91vh;overflow:auto;width:min(430px,100%);background:#151922;border-radius:28px 28px 0 0;padding:23px 18px 34px}.players{display:grid;grid-template-columns:1fr 1fr;gap:9px}.p{background:#202631;color:#fff;border:1px solid #303847;border-radius:15px;padding:11px}.tabs{display:flex;gap:7px;overflow:auto}.chip{white-space:nowrap;font-size:11px}.chip.active{background:var(--a);border-color:var(--a)}.bigstat{font-size:18px;font-weight:900}.statsgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.statbox{background:#131720;border:1px solid var(--line);border-radius:16px;padding:12px;text-align:center}.statbox b{display:block;font-size:22px}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;background:#11151d;border:1px solid var(--line);border-radius:20px;padding:12px}.day{text-align:center;padding:8px 2px;border-radius:10px;font-size:12px}.day.head{color:var(--muted);font-size:9px}.day.gameDay{background:color-mix(in srgb,var(--a) 28%,#151a23);border:1px solid var(--a);font-weight:900}.game{border-left:4px solid var(--a);box-shadow:0 8px 24px #0003}.timeline{position:relative;margin-top:16px}.event{position:relative;padding-left:16px}.event.goal{border-left:4px solid var(--a)}.event.penalty{border-left:4px solid #ffb347}.event.opp{border-left:4px solid #ff5964}.event .ico{font-size:23px}.flash{position:fixed;z-index:60;inset:0;background:#120607ed;display:none;place-items:center;text-align:center}.siren{font-size:88px;filter:drop-shadow(0 0 30px red);animation:shake .12s infinite alternate}.flash strong{display:block;font-size:48px}@keyframes shake{to{transform:translateX(7px) rotate(5deg)}}.colors{display:flex;gap:12px}.colors input{height:52px;padding:3px}.fileLabel{display:block;text-align:center}.profilePic{width:145px;height:145px;border-radius:28px;object-fit:cover;background:#202837;margin:12px auto;display:grid;place-items:center;font-size:60px}.center{text-align:center}
</style></head><body><main class="app"><header class="top"><div class="brand"><img class="appLogo" src="logo.png">RynqTracker</div><button class="pill" id="settingsBtn" onclick="openSettings()">⚙︎</button></header>
<section id="welcomePage" class="page active"><div class="welcome"><img class="welcomeLogo" src="logo.png"><h1 id="welcomeTitle">Deine Teams</h1><button class="primary" onclick="openTeamCreate()">＋ NEUES TEAM ERSTELLEN</button><div class="teamChooser" id="teamChooser"></div></div></section>
<section id="homePage" class="page"><div class="hero"><div class="label">AKTUELLES SPIEL</div><div class="teamscore"><div class="team"><div class="logo" id="homeLogo"></div><b id="homeTeam"></b></div><div class="score" id="homeScore">0 : 0</div><div class="team"><div class="logo">VS</div><b id="awayTeam">GEGNER</b></div></div><div class="meta center" id="gameStatus"></div><button class="primary" onclick="openGoal()">＋ TOR EINTRAGEN</button><button class="secondary" onclick="openNewGame()">NEUES SPIEL</button></div><h2>Punkte-Leader</h2><div class="leaders" id="leaders"></div><h2>Letzte Aktion</h2><div class="panel" id="activity"></div></section>
<section id="gamesPage" class="page"><h2>Spiele</h2><div class="row"><select id="seasonSelect" onchange="setSeason(this.value)"></select><button class="small" onclick="openSeasonManager()">＋</button></div><div id="calendarWrap" style="margin-top:14px"></div><button class="primary" onclick="openNewGame()">＋ NEUES SPIEL</button><div id="gamesList" style="margin-top:14px"></div></section>
<section id="trackPage" class="page"><h2>Spiel-Tracker</h2><div class="panel center"><div class="label">AKTUELLER SPIELSTAND</div><h1 id="trackScore">0 : 0</h1></div><div class="row"><button class="primary" onclick="openGoal()">TOR</button><button class="secondary" onclick="addShot()">SCHUSS</button></div><div class="row"><button class="secondary" onclick="addOpponentGoal()">GEGENTOR</button><button class="secondary" onclick="openGoalieEvent()">SAVE</button></div><button class="secondary" onclick="openPenalty()">＋ STRAFE</button><h2>Scoresheet</h2><div id="liveSheet"></div></section>
<section id="teamPage" class="page"><h2>Mannschaft</h2><button class="secondary" onclick="openTeamEdit()">TEAM BEARBEITEN</button><button class="primary" onclick="openPlayerForm()">＋ SPIELER HINZUFÜGEN</button><div id="coachBox"></div><div id="teamList" style="margin-top:14px"></div></section>
<section id="statsPage" class="page"><h2>Statistiken</h2><div class="tabs"><button class="chip active" onclick="setStat('p',this)">Punkte</button><button class="chip" onclick="setStat('g',this)">Tore</button><button class="chip" onclick="setStat('a',this)">Assists</button><button class="chip" onclick="setStat('shot',this)">Tor%</button><button class="chip" onclick="setStat('goalie',this)">SV%</button><button class="chip" onclick="setStat('pen',this)">Strafen</button></div><div id="statsList" style="margin-top:12px"></div></section>
<section id="profilePage" class="page"><button class="pill" onclick="go('team')">‹ Zurück</button><div id="profile"></div></section></main>
<nav class="nav hidden" id="nav"><button data-p="home" onclick="go('home')"><b>⌂</b>HOME</button><button data-p="games" onclick="go('games')"><b>▣</b>SPIELE</button><button data-p="track" onclick="go('track')"><b>＋</b>TRACK</button><button data-p="team" onclick="go('team')"><b>♟</b>TEAM</button><button data-p="stats" onclick="go('stats')"><b>▥</b>STATS</button></nav><div class="modal" id="modal"><div class="sheet" id="sheet"></div></div><div class="flash" id="flash"><div><div class="siren">🚨</div><strong>TOOOR!</strong><div id="flashName"></div></div></div>
<script>
const $=id=>document.getElementById(id),KEY='rynqV5'; const fresh=()=>({version:6,teams:[],activeTeamId:null,opponents:[],accent:'#68a4ff'});let db;try{db=JSON.parse(localStorage.getItem(KEY))||fresh()}catch(e){db=fresh()}db.opponents=db.opponents||[];db.accent=db.accent||'#68a4ff';let statMode='p',pendingImg='',pendingTeamLogo='',scorer=0,a1=0,strength='EV';const team=()=>db.teams.find(t=>t.id===db.activeTeamId)||null;const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function normalize(t){t.coach=t.coach||'';t.rink=t.rink||'';t.location=t.location||t.teamCity||'';t.games=t.games||[];t.players=t.players||[];t.players.forEach(p=>{p.shots=p.shots||0;p.pim=p.pim||0;p.goalie=p.goalie||{saves:0,ga:0,w:0,l:0,so:0}});t.games.forEach(g=>g.events=g.events||[])}db.teams.forEach(normalize);function save(){localStorage.setItem(KEY,JSON.stringify(db));render()}function modal(h){$('sheet').innerHTML=h;$('modal').style.display='flex'}function closeM(){$('modal').style.display='none'}
function showTeamHub(){db.activeTeamId=null;save()}function selectTeam(id){db.activeTeamId=id;localStorage.setItem(KEY,JSON.stringify(db));go('home')}function renderHub(){let has=db.teams.length;$('welcomeTitle').textContent=has?'Deine Teams':'Erstelle dein erstes Team';$('teamChooser').innerHTML=has?`<h2>Teams</h2>${db.teams.map(t=>`<div class="teamcard" onclick="selectTeam(${t.id})"><div class="logo">${t.teamLogo?`<img src="${t.teamLogo}">`:esc(t.teamShort)}</div><div class="grow"><b>${esc(t.team)}</b><div class="meta">${esc(t.rink||t.location||'')} · ${t.players.length} Spieler</div></div><b>›</b></div>`).join('')}`:''}
function go(p){document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));$(p+'Page').classList.add('active');document.querySelectorAll('.nav button').forEach(x=>x.classList.toggle('active',x.dataset.p===p));render()}function render(){document.documentElement.style.setProperty('--a',db.accent);let t=team();if(!t){document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));$('welcomePage').classList.add('active');$('nav').classList.add('hidden');$('settingsBtn').classList.add('hidden');renderHub();return}$('nav').classList.remove('hidden');$('settingsBtn').classList.remove('hidden');normalize(t);if(!t.activeSeason&&t.seasons?.[0])t.activeSeason=t.seasons[0].id;$('homeTeam').textContent=t.teamShort;$('homeLogo').innerHTML=t.teamLogo?`<img src="${t.teamLogo}">`:esc(t.teamShort);let c=t.current;$('homeScore').textContent=c?`${c.hs} : ${c.as}`:'0 : 0';$('awayTeam').textContent=c?c.opponent:'GEGNER';$('gameStatus').textContent=c?`${c.date} · ${t.rink||t.location||''}`:'Noch kein Spiel gestartet';$('trackScore').textContent=c?`${c.hs} : ${c.as}`:'0 : 0';$('activity').textContent=t.activity||'Noch keine Aktion.';let sorted=[...t.players].sort((a,b)=>(b.g+b.a)-(a.g+a.a));$('leaders').innerHTML=sorted.slice(0,4).map(p=>`<div class="leader" onclick="profile(${p.id})"><div class="meta">#${p.no} ${esc(p.n)}</div><b>${p.g+p.a} P</b><div class="meta">${p.g} T · ${p.a} A</div></div>`).join('')||'<div class="meta">Noch keine Spieler.</div>';$('teamList').innerHTML=t.players.map(p=>`<div class="statrow" onclick="profile(${p.id})"><div class="mini">${p.img?`<img src="${p.img}">`:(p.pos==='G'?'🥅':'🏒')}</div><div class="grow"><b>#${p.no} ${esc(p.n)}</b><div class="meta">${p.pos} · ${p.status||'Aktiv'}</div></div><b>›</b></div>`).join('');$('coachBox').innerHTML=`<h2>Trainerteam</h2><div class="coach"><div class="mini">👔</div><div><b>${esc(t.coach||'Noch kein Trainer')}</b><div class="meta">Head Coach</div></div></div>`;renderGames();renderStats();renderSheet(c);}
function newTeamData(n,s,loc,rink,coach,logo){return{id:Date.now()+Math.random(),team:n,teamShort:s,teamCity:loc,location:loc,rink,coach,teamLogo:logo,teamColors:{primary:db.accent,secondary:'#202631'},players:[],seasons:[{id:'season-'+Date.now(),name:'2026/27'}],activeSeason:null,games:[],current:null,activity:'Noch keine Aktion.'}}function openTeamCreate(){pendingTeamLogo='';modal(`<h3>Team erstellen</h3><input id="tn" placeholder="Teamname"><div class="row"><input id="ts" maxlength="4" placeholder="Kürzel"><input id="tc" placeholder="Standort / Stadt"></div><input id="tr" placeholder="Eishalle"><input id="coach" placeholder="Head Coach"><label class="secondary fileLabel">TEAMLOGO AUSWÄHLEN<input type="file" accept="image/*" style="display:none" onchange="teamLogoFile(this)"></label><button class="primary" onclick="createTeam()">TEAM ERSTELLEN</button><button class="secondary" onclick="closeM()">Abbrechen</button>`)}function teamLogoFile(i){let f=i.files[0];if(!f)return;let r=new FileReader();r.onload=e=>pendingTeamLogo=e.target.result;r.readAsDataURL(f)}function createTeam(){let n=$('tn').value.trim();if(!n)return;let t=newTeamData(n,($('ts').value.trim()||n.slice(0,3)).toUpperCase(),$('tc').value.trim(),$('tr').value.trim(),$('coach').value.trim(),pendingTeamLogo);t.activeSeason=t.seasons[0].id;db.teams.push(t);db.activeTeamId=t.id;closeM();save();go('home')}function openTeamEdit(){let t=team();pendingTeamLogo=t.teamLogo||'';modal(`<h3>Team bearbeiten</h3><input id="tn" value="${esc(t.team)}"><div class="row"><input id="ts" value="${esc(t.teamShort)}"><input id="tc" value="${esc(t.location)}"></div><input id="tr" value="${esc(t.rink)}" placeholder="Eishalle"><input id="coach" value="${esc(t.coach)}" placeholder="Head Coach"><label class="secondary fileLabel">TEAMLOGO ÄNDERN<input type="file" accept="image/*" style="display:none" onchange="teamLogoFile(this)"></label><button class="primary" onclick="saveTeamEdit()">SPEICHERN</button><button class="secondary" onclick="closeM()">Abbrechen</button>`)}function saveTeamEdit(){let t=team();t.team=$('tn').value.trim()||t.team;t.teamShort=$('ts').value.trim().toUpperCase()||t.teamShort;t.location=$('tc').value.trim();t.teamCity=t.location;t.rink=$('tr').value.trim();t.coach=$('coach').value.trim();t.teamLogo=pendingTeamLogo;closeM();save()}
function posOptions(){return '<option>Stürmer</option><option>Verteidiger</option><option value="G">Torhüter</option>'}function openPlayerForm(){pendingImg='';modal(`<h3>Spieler hinzufügen</h3><input id="pn" placeholder="Name"><div class="row"><input id="pno" type="number" placeholder="Nr."><select id="pp">${posOptions()}</select></div><label class="secondary fileLabel">SPIELERBILD<input type="file" accept="image/*" style="display:none" onchange="playerFile(this)"></label><button class="primary" onclick="addPlayer()">SPEICHERN</button><button class="secondary" onclick="closeM()">Abbrechen</button>`)}function playerFile(i){let f=i.files[0];if(!f)return;let r=new FileReader();r.onload=e=>pendingImg=e.target.result;r.readAsDataURL(f)}function addPlayer(){let n=$('pn').value.trim();if(!n)return;team().players.push({id:Date.now()+Math.random(),n,no:+$('pno').value||0,pos:$('pp').value,status:'Aktiv',g:0,a:0,gp:0,shots:0,pim:0,img:pendingImg,goalie:{saves:0,ga:0,w:0,l:0,so:0}});closeM();save()}
function opponentOptions(){return db.opponents.map(o=>`<option value="${esc(o.name)}">${esc(o.name)}</option>`).join('')}function openNewGame(){modal(`<h3>Neues Spiel</h3><label class="meta">Gespeicherter Gegner</label><select id="oppSaved" onchange="if(this.value)opp.value=this.value"><option value="">– auswählen –</option>${opponentOptions()}</select><input id="opp" placeholder="Gegner"><div class="row"><input id="date" type="date" value="${new Date().toISOString().slice(0,10)}"><input id="time" type="time" value="19:30"></div><input id="gameRink" placeholder="Eishalle" value="${esc(team().rink||'')}"><button class="primary" onclick="startGame()">SPIEL ANLEGEN</button><button class="secondary" onclick="closeM()">Abbrechen</button>`)}function startGame(){let t=team(),o=$('opp').value.trim();if(!o)return;if(!db.opponents.some(x=>x.name.toLowerCase()===o.toLowerCase()))db.opponents.push({id:Date.now(),name:o});let g={id:Date.now(),opponent:o,date:$('date').value,time:$('time').value,rink:$('gameRink').value,hs:0,as:0,season:t.activeSeason,events:[]};t.current=g;t.games.push(g);t.players.forEach(p=>p.gp++);t.activity='Spiel gegen '+o+' angelegt.';closeM();save()}
function playerButtons(fn,exclude=[]){return `<div class="players">${team().players.filter(p=>!exclude.includes(p.id)).map(p=>`<button class="p" onclick="${fn}(${p.id})">#${p.no}<br><b>${esc(p.n)}</b></button>`).join('')}</div>`}function openGoal(){if(!team().current)return openNewGame();scorer=0;a1=0;modal(`<h3>Wer hat getroffen?</h3>${playerButtons('pickScorer')}<button class="secondary" onclick="closeM()">Abbrechen</button>`)}function pickScorer(id){scorer=id;modal(`<h3>1. Assist</h3>${playerButtons('pickA1',[id])}<button class="secondary" onclick="pickA1(0)">OHNE ASSIST</button>`)}function pickA1(id){a1=id;modal(`<h3>2. Assist</h3>${playerButtons('finishGoal',[scorer,a1])}<button class="secondary" onclick="finishGoal(0)">KEIN 2. ASSIST</button>`)}function finishGoal(a2){let t=team(),p=t.players.find(x=>x.id===scorer);p.g++;p.shots++;[a1,a2].filter(Boolean).forEach(id=>t.players.find(x=>x.id===id).a++);t.current.hs++;t.current.events.push({type:'goal',scorer,a1,a2,clock:new Date().toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'})});t.activity=`Tor: #${p.no} ${p.n}`;closeM();save();$('flashName').textContent='#'+p.no+' '+p.n;$('flash').style.display='grid';setTimeout(()=>$('flash').style.display='none',1800)}function addShot(){let t=team();if(!t.current)return openNewGame();modal(`<h3>Schuss von</h3>${playerButtons('shotBy')}<button class="secondary" onclick="closeM()">Abbrechen</button>`)}function shotBy(id){let p=team().players.find(x=>x.id===id);p.shots++;team().current.events.push({type:'shot',player:id,clock:new Date().toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'})});team().activity='Schuss: '+p.n;closeM();save()}function addOpponentGoal(){let t=team();if(!t.current)return openNewGame();t.current.as++;t.current.events.push({type:'oppgoal',clock:new Date().toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'})});t.players.filter(p=>p.pos==='G').forEach(p=>p.goalie.ga++);save()}function openGoalieEvent(){if(!team().current)return openNewGame();let gs=team().players.filter(p=>p.pos==='G');modal(`<h3>Save von</h3>${gs.map(g=>`<button class="secondary" onclick="goalieSave(${g.id})">#${g.no} ${esc(g.n)}</button>`).join('')||'<div class="meta">Kein Torhüter angelegt.</div>'}`)}function goalieSave(id){let p=team().players.find(x=>x.id===id);p.goalie.saves++;team().current.events.push({type:'save',goalie:id,clock:new Date().toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'})});closeM();save()}
function openPenalty(){if(!team().current)return openNewGame();modal(`<h3>Strafe</h3>${playerButtons('penaltyPlayer')}<button class="secondary" onclick="penaltyPlayer(0)">TEAMSTRAFE</button>`)}function penaltyPlayer(id){modal(`<h3>Strafminuten</h3><div class="row"><button class="secondary" onclick="finishPenalty(${id},2)">2 MIN</button><button class="secondary" onclick="finishPenalty(${id},5)">5 MIN</button></div><input id="customPen" type="number" placeholder="Andere Minuten"><input id="penReason" placeholder="Grund, z. B. Beinstellen"><button class="primary" onclick="finishPenalty(${id},+customPen.value||2)">EINTRAGEN</button>`)}function finishPenalty(id,min){let t=team(),p=t.players.find(x=>x.id===id);if(p)p.pim+=min;t.current.events.push({type:'penalty',player:id,min,reason:$('penReason')?.value||'',clock:new Date().toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'})});t.activity=`Strafe: ${p?p.n:'Team'} · ${min} Min.`;closeM();save()}
function renderSheet(g){if(!g){$('liveSheet').innerHTML='<div class="meta">Noch kein Spiel ausgewählt.</div>';return}$('liveSheet').innerHTML=g.events.length?[...g.events].reverse().map(e=>eventHTML(e)).join(''):'<div class="meta">Noch keine Ereignisse.</div>'}function eventHTML(e){let t=team(),p=id=>t.players.find(x=>x.id===id);if(e.type==='goal'){let s=p(e.scorer),ass=[e.a1,e.a2].filter(Boolean).map(x=>p(x)?.n).filter(Boolean).join(', ');return `<div class="event goal"><div class="ico">🥅</div><div class="grow"><b>TOR · ${esc(s?.n||'Spieler')}</b><div class="meta">${ass?'Assists: '+esc(ass):'Ohne Assist'} · ${e.clock||''}</div></div></div>`}if(e.type==='oppgoal')return `<div class="event opp"><div class="ico">🔴</div><div><b>Gegentor</b><div class="meta">${e.clock||''}</div></div></div>`;if(e.type==='penalty'){let x=p(e.player);return `<div class="event penalty"><div class="ico">⏱</div><div><b>${e.min} Min. · ${esc(x?.n||'Teamstrafe')}</b><div class="meta">${esc(e.reason||'Strafe')} · ${e.clock||''}</div></div></div>`}return ''}
function renderGames(){let t=team();if(!t)return;$('seasonSelect').innerHTML=(t.seasons||[]).map(s=>`<option value="${s.id}" ${s.id===t.activeSeason?'selected':''}>${esc(s.name)}</option>`).join('');let gs=t.games.filter(g=>!t.activeSeason||g.season===t.activeSeason).sort((a,b)=>a.date.localeCompare(b.date));$('gamesList').innerHTML=gs.map(g=>`<div class="game" onclick="gameDetail(${g.id})"><div class="grow"><b>${esc(t.teamShort)} vs. ${esc(g.opponent)}</b><div class="meta">${g.date} · ${g.time||''} ${g.rink?'· '+esc(g.rink):''}</div></div><b>${g.hs}:${g.as}</b></div>`).join('')||'<div class="meta">Noch keine Spiele.</div>';renderCalendar(gs)}function renderCalendar(gs){let d=gs[0]?.date?new Date(gs[0].date+'T12:00:00'):new Date(),y=d.getFullYear(),m=d.getMonth(),first=new Date(y,m,1),days=new Date(y,m+1,0).getDate(),off=(first.getDay()+6)%7,names=['MO','DI','MI','DO','FR','SA','SO'];let gameDays=new Set(gs.filter(g=>new Date(g.date+'T12:00:00').getMonth()===m).map(g=>+g.date.slice(8,10)));let h=`<div class="meta" style="margin:5px 0 8px"><b>${d.toLocaleDateString('de-DE',{month:'long',year:'numeric'})}</b></div><div class="calendar">${names.map(x=>`<div class="day head">${x}</div>`).join('')}${'<div></div>'.repeat(off)}`;for(let i=1;i<=days;i++)h+=`<div class="day ${gameDays.has(i)?'gameDay':''}">${i}</div>`;$('calendarWrap').innerHTML=h+'</div>'}function gameDetail(id){let g=team().games.find(x=>x.id===id);modal(`<h3>${esc(team().teamShort)} ${g.hs}:${g.as} ${esc(g.opponent)}</h3><div class="meta">${g.date} · ${g.time||''} · ${esc(g.rink||'')}</div><h2>Scoresheet</h2><div class="timeline">${g.events.map(eventHTML).join('')||'<div class="meta">Keine Ereignisse.</div>'}</div><button class="secondary" onclick="closeM()">Schließen</button>`)}
function savePct(p){let s=p.goalie.saves+p.goalie.ga;return s?p.goalie.saves/s*100:0}function shotPct(p){return p.shots?p.g/p.shots*100:0}function setStat(m,b){statMode=m;document.querySelectorAll('.tabs .chip').forEach(x=>x.classList.remove('active'));b.classList.add('active');renderStats()}function statVal(p){return statMode==='g'?p.g:statMode==='a'?p.a:statMode==='shot'?shotPct(p):statMode==='goalie'?savePct(p):statMode==='pen'?p.pim:p.g+p.a}function renderStats(){let t=team();if(!t)return;let ps=[...t.players];if(statMode==='goalie')ps=ps.filter(p=>p.pos==='G');ps.sort((a,b)=>statVal(b)-statVal(a));$('statsList').innerHTML=ps.map((p,i)=>`<div class="statrow" onclick="profile(${p.id})"><b>${i+1}.</b><div class="grow"><b>${esc(p.n)}</b><div class="meta">${p.g} T · ${p.a} A · ${p.shots} Schüsse · ${p.pim} PIM</div></div><div class="bigstat">${['shot','goalie'].includes(statMode)?statVal(p).toFixed(1)+'%':statVal(p)}</div></div>`).join('')||'<div class="meta">Noch keine Daten.</div>'}function profile(id){let p=team().players.find(x=>x.id===id);go('profile');$('profile').innerHTML=`<div class="center">${p.img?`<img class="profilePic" src="${p.img}">`:`<div class="profilePic">${p.pos==='G'?'🥅':'🏒'}</div>`}<h1>#${p.no} ${esc(p.n)}</h1><div class="meta">${p.pos}</div></div><div class="statsgrid"><div class="statbox"><b>${p.g+p.a}</b>Punkte</div><div class="statbox"><b>${p.g}</b>Tore</div><div class="statbox"><b>${p.a}</b>Assists</div><div class="statbox"><b>${p.shots}</b>Schüsse</div><div class="statbox"><b>${shotPct(p).toFixed(1)}%</b>Torquote</div><div class="statbox"><b>${p.pim}</b>PIM</div>${p.pos==='G'?`<div class="statbox"><b>${p.goalie.saves}</b>Saves</div><div class="statbox"><b>${savePct(p).toFixed(1)}%</b>SV%</div>`:''}</div>`}
function openSeasonManager(){let t=team();modal(`<h3>Saisons</h3>${t.seasons.map(s=>`<button class="secondary" onclick="setSeason('${s.id}');closeM()">${esc(s.name)}</button>`).join('')}<input id="newSeason" placeholder="z. B. 2027/28"><button class="primary" onclick="addSeason()">SAISON HINZUFÜGEN</button>`)}function addSeason(){let n=$('newSeason').value.trim();if(!n)return;let id='season-'+Date.now();team().seasons.push({id,name:n});team().activeSeason=id;closeM();save()}function setSeason(id){team().activeSeason=id;save()}
function openOpponents(){modal(`<h3>Gegner-Datenbank</h3>${db.opponents.map(o=>`<div class="statrow"><div class="grow"><b>${esc(o.name)}</b></div><button class="small" onclick="deleteOpp(${o.id})">×</button></div>`).join('')||'<div class="meta">Noch keine Gegner gespeichert.</div>'}<input id="newOpp" placeholder="Gegnerteam"><button class="primary" onclick="addOpp()">GEGNER SPEICHERN</button><button class="secondary" onclick="closeM()">Schließen</button>`)}function addOpp(){let n=$('newOpp').value.trim();if(n&&!db.opponents.some(o=>o.name.toLowerCase()===n.toLowerCase()))db.opponents.push({id:Date.now(),name:n});closeM();save()}function deleteOpp(id){db.opponents=db.opponents.filter(o=>o.id!==id);openOpponents();save()}
function openSettings(){modal(`<h3>Einstellungen</h3><div class="label">AKZENTFARBE</div><div class="colors"><input id="accent" type="color" value="${db.accent}"><button class="secondary" onclick="db.accent=accent.value;closeM();save()">FARBE ÜBERNEHMEN</button></div><button class="secondary" onclick="openOpponents()">GEGNER-DATENBANK</button><button class="secondary" onclick="showTeamHub();closeM()">TEAM WECHSELN / WEITERES TEAM</button><button class="secondary" onclick="openTeamEdit()">TEAM BEARBEITEN</button><button class="secondary" onclick="openSeasonManager()">SAISONS VERWALTEN</button><button class="secondary" onclick="closeM()">Schließen</button>`)}render();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
