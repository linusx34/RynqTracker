<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#090b10"><link rel="manifest" href="manifest.webmanifest"><title>RynqTracker</title><style>
*{box-sizing:border-box}body{margin:0;background:#090b10;color:#fff;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}.app{max-width:430px;margin:auto;min-height:100vh;padding:22px 18px 105px}.top{display:flex;justify-content:space-between;align-items:center}.brand{font-size:24px;font-weight:900;letter-spacing:-1px}.brand i{font-style:normal;color:#68a4ff}.pill,.chip{border:1px solid #293242;background:#141923;color:#fff;border-radius:14px;padding:9px 12px;font-weight:750}.hero,.panel{margin-top:20px;padding:20px;border:1px solid #242b37;border-radius:26px;background:linear-gradient(145deg,#171c26,#0e1118)}.label{font-size:11px;letter-spacing:1.5px;color:#8b96a8;font-weight:800}.teams{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;margin:18px 0}.team{text-align:center}.logo{width:66px;height:66px;margin:auto;border-radius:20px;display:grid;place-items:center;background:#202837;font-size:22px;font-weight:900;overflow:hidden}.logo img{width:100%;height:100%;object-fit:cover}.score{font-size:42px;font-weight:900}.status{text-align:center;color:#9ba5b5;font-size:13px}.primary,.secondary,.danger{width:100%;margin-top:12px;border:0;border-radius:17px;padding:15px;font-size:14px;font-weight:900}.primary{background:#fff;color:#080a0e}.secondary{background:#202631;color:#fff;border:1px solid #303847}.danger{background:#2b171b;color:#ff9aa8;border:1px solid #58303a}h2{font-size:19px;margin:26px 0 13px}h3{margin:0 0 5px}.leaders{display:flex;gap:12px;overflow:auto;padding-bottom:5px}.card{min-width:142px;background:#131720;border:1px solid #242b37;border-radius:21px;overflow:hidden;cursor:pointer}.photo{height:112px;background:linear-gradient(160deg,#31405a,#151a24);display:grid;place-items:center;font-size:48px;background-size:cover;background-position:center}.info{padding:12px}.name{font-weight:800}.meta{font-size:11px;color:#8993a3;margin-top:3px}.pts{font-size:22px;font-weight:900;margin-top:8px}.pts span{font-size:10px;color:#8d98aa}.nav{position:fixed;z-index:20;bottom:0;left:50%;transform:translateX(-50%);width:min(430px,100%);height:82px;background:#0c0f15f2;backdrop-filter:blur(16px);border-top:1px solid #242934;display:flex;justify-content:space-around;padding-top:13px}.nav button{border:0;background:none;color:#778294;font-size:9px;font-weight:700}.nav b{display:grid;place-items:center;height:23px;margin-bottom:4px}.nav svg,.pill svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}.nav .active{color:#fff}.page{display:none}.page.active{display:block}.modal{position:fixed;z-index:30;inset:0;background:#05070bef;display:none;align-items:flex-end;justify-content:center}.sheet{max-height:90vh;overflow:auto;width:min(430px,100%);background:#151922;border-radius:28px 28px 0 0;padding:24px 18px 34px}.players,.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.p{background:#202631;color:#fff;border:1px solid #303847;border-radius:16px;padding:12px;text-align:center}.p img{width:64px;height:64px;object-fit:cover;border-radius:16px}.face{font-size:35px}.row{display:flex;gap:10px}.row>*{flex:1}input,select{width:100%;padding:14px;margin-top:10px;border-radius:14px;border:1px solid #303847;background:#0f131a;color:#fff;font-size:15px}.statrow,.game,.event{display:flex;align-items:center;gap:12px;padding:13px;background:#131720;border:1px solid #242b37;border-radius:17px;margin-bottom:9px}.statrow .mini{width:48px;height:48px;border-radius:13px;background:#202837;object-fit:cover;display:grid;place-items:center}.grow{flex:1}.bigstat{font-weight:900;font-size:18px}.flash{position:fixed;z-index:50;inset:0;background:radial-gradient(circle at center,#fff 0,#e7efff 45%,#68a4ff 100%);color:#05070b;display:none;place-items:center;text-align:center;animation:pop .45s ease}.flash strong{font-size:55px;letter-spacing:-4px}.flash .goalpic{width:150px;height:150px;border-radius:30px;object-fit:cover;margin:0 auto 14px;display:block}@keyframes pop{0%{transform:scale(.82);opacity:0}100%{transform:scale(1);opacity:1}}.empty{color:#8993a3;text-align:center;padding:28px}.profileHero{text-align:center}.profilePic{width:160px;height:160px;border-radius:32px;object-fit:cover;background:#202837;font-size:70px;display:grid;place-items:center;margin:10px auto}.stats4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.stats4 div{text-align:center;background:#131720;border:1px solid #242b37;border-radius:15px;padding:12px 5px}.stats4 b{font-size:22px;display:block}.click{cursor:pointer}.tabs{display:flex;gap:7px;overflow:auto;margin-bottom:12px}.chip{white-space:nowrap;padding:8px 11px;font-size:12px}.chip.active{background:#fff;color:#090b10}.badge{display:inline-block;padding:4px 7px;border-radius:8px;background:#202837;font-size:10px;color:#b9c3d3;margin-left:5px}.bar{height:8px;background:#202631;border-radius:99px;overflow:hidden;margin-top:8px}.bar i{display:block;height:100%;background:#fff;border-radius:99px}.seasonHead{display:flex;gap:8px;align-items:center}.seasonHead select{margin:0}.smallbtn{border:1px solid #303847;background:#202631;color:#fff;border-radius:12px;padding:10px;font-weight:800}.goaliegrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}.goaliegrid div{text-align:center;background:#131720;border-radius:14px;padding:10px 4px}.goaliegrid b{display:block;font-size:18px}.timeline{border-left:2px solid #293242;margin-left:8px;padding-left:14px}.muted{opacity:.55}.sectionTitle{display:flex;justify-content:space-between;align-items:center}.fileLabel{display:block;text-align:center}.trend{display:flex;align-items:end;gap:5px;height:65px;margin-top:12px}.trend i{flex:1;background:#dce8ff;border-radius:5px 5px 2px 2px;min-height:5px}.checkline{display:flex;align-items:center;gap:8px;margin-top:10px}.checkline input{width:auto;margin:0}.twoBtns{display:grid;grid-template-columns:1fr 1fr;gap:8px}.twoBtns button{margin-top:10px}
</style></head><body><main class="app"><div class="top"><div class="brand">Rynq<i>Tracker</i></div><button class="pill" onclick="openSettings()" aria-label="Einstellungen"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1-2.8 2.8-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.6v.2h-4v-.2a1.7 1.7 0 0 0-1-1.6 1.7 1.7 0 0 0-1.9.3l-.1.1L4.2 17l.1-.1a1.7 1.7 0 0 0 .3-1.9A1.7 1.7 0 0 0 3 14H2.8v-4H3a1.7 1.7 0 0 0 1.6-1 1.7 1.7 0 0 0-.3-1.9L4.2 7 7 4.2l.1.1a1.7 1.7 0 0 0 1.9.3 1.7 1.7 0 0 0 1-1.6v-.2h4V3a1.7 1.7 0 0 0 1 1.6 1.7 1.7 0 0 0 1.9-.3l.1-.1L19.8 7l-.1.1a1.7 1.7 0 0 0-.3 1.9 1.7 1.7 0 0 0 1.6 1h.2v4H21a1.7 1.7 0 0 0-1.6 1Z"/></svg></button></div>
<section id="homePage" class="page active"><div class="hero"><div class="label">AKTUELLES SPIEL</div><div class="teams"><div class="team"><div class="logo" id="homeLogo">RYN</div><b id="homeTeam">RYNQ</b></div><div class="score"><span id="homeScore">0</span> : <span id="awayScore">0</span></div><div class="team"><div class="logo" id="awayLogo">G</div><b id="awayTeam">GEGNER</b></div></div><div class="status" id="gameStatus">Noch kein Spiel gestartet</div><button class="primary" onclick="openGoal()">＋ TOR EINTRAGEN</button><button class="secondary" onclick="openNewGame()">NEUES SPIEL</button></div><h2>Punkte-Leader</h2><div class="leaders" id="leaders"></div><h2>Letzte Aktion</h2><div class="panel" id="activity">Noch keine Aktion.</div></section>
<section id="gamesPage" class="page"><div class="sectionTitle"><h2>Spiele</h2><button class="smallbtn" onclick="openSeasonManager()">Saison</button></div><div class="seasonHead"><select id="seasonFilter" onchange="setSeason(this.value)"></select></div><button class="primary" onclick="openNewGame()">＋ NEUES SPIEL</button><div id="gamesList" style="margin-top:14px"></div></section>
<section id="trackPage" class="page"><h2>Live-Tracker</h2><div class="panel"><div class="label">SCHNELLERFASSUNG</div><button class="primary" onclick="openGoal()">TOR</button><div class="twoBtns"><button class="secondary" onclick="addOpponentGoal()">GEGENTOR</button><button class="secondary" onclick="openGoalieEvent()">GOALIE</button></div></div><div class="panel"><b id="trackScore">0 : 0</b><div class="meta">Aktueller Spielstand</div><div id="liveEvents" style="margin-top:14px"></div></div></section>
<section id="teamPage" class="page"><h2>Mannschaft</h2><button class="secondary" onclick="openTeamEdit()">TEAM BEARBEITEN</button><button class="primary" onclick="openPlayerForm()">＋ SPIELER HINZUFÜGEN</button><div id="teamList" style="margin-top:14px"></div></section>
<section id="statsPage" class="page"><h2>Statistiken</h2><div class="tabs" id="statTabs"><button class="chip active" onclick="setStat('p',this)">Punkte</button><button class="chip" onclick="setStat('g',this)">Tore</button><button class="chip" onclick="setStat('a',this)">Assists</button><button class="chip" onclick="setStat('ppg',this)">PPG</button><button class="chip" onclick="setStat('goalie',this)">Goalies</button></div><div id="statsList"></div></section>
<section id="profilePage" class="page"><button class="pill" onclick="go('team')">‹ Zurück</button><div id="profile"></div></section>
<section id="gameDetailPage" class="page"><button class="pill" onclick="go('games')">‹ Zurück</button><div id="gameDetail"></div></section></main>
<nav class="nav"><button data-p="home" class="active" onclick="go('home')"><b><svg viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/></svg></b>HOME</button><button data-p="games" onclick="go('games')"><b><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M8 3v4M16 3v4M3 10h18"/></svg></b>SPIELE</button><button data-p="track" onclick="go('track')"><b><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg></b>TRACK</button><button data-p="team" onclick="go('team')"><b><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3"/><circle cx="17" cy="9" r="2"/><path d="M3 20c0-4 2.7-6 6-6s6 2 6 6M15 15c3 0 5 1.7 5 5"/></svg></b>TEAM</button><button data-p="stats" onclick="go('stats')"><b><svg viewBox="0 0 24 24"><path d="M5 20V10M12 20V4M19 20v-7"/></svg></b>STATS</button></nav>
<div class="modal" id="modal"><div class="sheet" id="sheet"></div></div><div class="flash" id="flash"><div><img id="flashPic" class="goalpic" style="display:none"><strong>TOOOR!</strong><div id="flashName"></div><div id="flashSub" class="meta" style="color:#17202f;font-size:13px"></div></div></div>
<script>
const KEY='rynqV4';const old=localStorage.getItem('rinqV2');const defaults={version:4,team:'Rynq',teamShort:'RYN',teamLogo:'',teamCity:'',teamColors:{primary:'#68a4ff',secondary:'#ffffff'},players:[{id:1,n:'Alex Frost',no:19,pos:'C',status:'Aktiv',g:0,a:0,gp:0,img:'',goalie:{saves:0,ga:0,w:0,l:0,so:0}},{id:2,n:'Noah Reed',no:8,pos:'LW',status:'Aktiv',g:0,a:0,gp:0,img:'',goalie:{saves:0,ga:0,w:0,l:0,so:0}},{id:3,n:'Finn Cole',no:91,pos:'D',status:'Aktiv',g:0,a:0,gp:0,img:'',goalie:{saves:0,ga:0,w:0,l:0,so:0}}],seasons:[{id:'2026-27',name:'2026/27'}],activeSeason:'2026-27',games:[],current:null,activity:'Noch keine Aktion.'};
function migrate(x){x.version=4;x.team=x.team||'Rynq';x.teamShort=x.teamShort||'RYN';x.teamColors=x.teamColors||{primary:'#68a4ff',secondary:'#ffffff'};x.seasons=x.seasons||[{id:'2026-27',name:'2026/27'}];x.activeSeason=x.activeSeason||x.seasons[0].id;x.games=x.games||[];x.players=(x.players||[]).map(p=>({...p,pos:({'Stürmer':'C','Verteidiger':'D','Torhüter':'G'}[p.pos]||p.pos||'C'),status:p.status||'Aktiv',goalie:p.goalie||{saves:0,ga:0,w:0,l:0,so:0}}));x.games.forEach(g=>{g.id=g.id||Date.now()+Math.random();g.season=g.season||x.activeSeason;g.events=g.events||[]});return x}
let d;try{d=migrate(JSON.parse(localStorage.getItem(KEY)||old)||structuredClone(defaults))}catch(e){d=structuredClone(defaults)}let statMode='p';const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));const save=()=>{localStorage.setItem(KEY,JSON.stringify(d));render()};
function go(p){document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));$(p+'Page').classList.add('active');document.querySelectorAll('.nav button').forEach(x=>x.classList.toggle('active',x.dataset.p===p));render()}
function seasonName(id){return d.seasons.find(s=>s.id===id)?.name||id}function currentGames(){return d.games.filter(g=>g.season===d.activeSeason)}function playerEvents(id){return d.games.flatMap(g=>(g.events||[]).map(e=>({...e,game:g}))).filter(e=>e.scorer===id||e.a1===id||e.a2===id).sort((a,b)=>String(b.game.date).localeCompare(String(a.game.date)))}
function render(){let c=d.current;$('homeTeam').textContent=d.team.toUpperCase();$('homeLogo').innerHTML=d.teamLogo?`<img src="${d.teamLogo}">`:esc(d.teamShort.slice(0,3).toUpperCase());$('awayTeam').textContent=c?c.opponent.toUpperCase():'GEGNER';$('awayLogo').textContent=c?c.opponent.slice(0,2).toUpperCase():'G';$('homeScore').textContent=c?c.hs:0;$('awayScore').textContent=c?c.as:0;$('trackScore').textContent=(c?c.hs:0)+' : '+(c?c.as:0);$('gameStatus').textContent=c?'Live · '+c.date+' · '+seasonName(c.season):'Noch kein Spiel gestartet';$('activity').textContent=d.activity;
let sk=[...d.players].filter(p=>p.pos!=='G').sort((a,b)=>(b.g+b.a)-(a.g+a.a));$('leaders').innerHTML=sk.slice(0,6).map(card).join('')||'<div class="empty">Noch keine Spieler.</div>';$('teamList').innerHTML=d.players.sort((a,b)=>a.no-b.no).map(x=>`<div class="statrow click ${x.status!=='Aktiv'?'muted':''}" onclick="profile(${x.id})">${mini(x)}<div class="grow"><b>#${x.no} ${esc(x.n)}</b><div class="meta">${x.pos} <span class="badge">${x.status}</span></div></div><b>›</b></div>`).join('');renderStats();renderGames();$('liveEvents').innerHTML=c&&c.events.length?`<div class="timeline">${[...c.events].reverse().map(eventHTML).join('')}</div>`:'<div class="meta">Noch keine Ereignisse.</div>'}
function renderGames(){$('seasonFilter').innerHTML=d.seasons.map(s=>`<option value="${s.id}" ${s.id===d.activeSeason?'selected':''}>${esc(s.name)}</option>`).join('');let gs=currentGames();if(d.current&&d.current.season===d.activeSeason)gs=[d.current,...gs];$('gamesList').innerHTML=gs.map(g=>`<div class="game click" onclick="gameDetail('${g.id}')"><div class="grow"><b>${esc(d.team)} – ${esc(g.opponent)}</b><div class="meta">${g.date}${g===d.current?' · LIVE':''}</div></div><b>${g.hs}:${g.as}</b></div>`).join('')||'<div class="empty">Noch keine Spiele in dieser Saison.</div>'}
function setStat(m,b){statMode=m;document.querySelectorAll('#statTabs .chip').forEach(x=>x.classList.remove('active'));b.classList.add('active');renderStats()}function renderStats(){let list=[...d.players];if(statMode==='goalie'){list=list.filter(p=>p.pos==='G').sort((a,b)=>savePct(b)-savePct(a));$('statsList').innerHTML=list.map((x,i)=>`<div class="statrow click" onclick="profile(${x.id})">${mini(x)}<div class="grow"><b>${i+1}. ${esc(x.n)}</b><div class="meta">SV% ${(savePct(x)*100).toFixed(1)} · ${x.goalie.saves} Saves · ${x.goalie.ga} GA</div></div><div class="bigstat">${x.goalie.so} SO</div></div>`).join('')||'<div class="empty">Noch keine Torhüter.</div>';return}list=list.filter(p=>p.pos!=='G').sort((a,b)=>val(b)-val(a));$('statsList').innerHTML=list.map((x,i)=>`<div class="statrow click" onclick="profile(${x.id})">${mini(x)}<div class="grow"><b>${i+1}. ${esc(x.n)}</b><div class="meta">${x.g} T · ${x.a} A · ${x.gp} SP</div><div class="bar"><i style="width:${Math.max(5,(val(x)/(val(list[0])||1))*100)}%"></i></div></div><div class="bigstat">${statMode==='ppg'?val(x).toFixed(2):val(x)}</div></div>`).join('')||'<div class="empty">Noch keine Statistiken.</div>'}function val(x){if(statMode==='g')return x.g;if(statMode==='a')return x.a;if(statMode==='ppg')return x.gp?(x.g+x.a)/x.gp:0;return x.g+x.a}function savePct(x){let sh=x.goalie.saves+x.goalie.ga;return sh?x.goalie.saves/sh:0}
function mini(x){return x.img?`<img class="mini" src="${x.img}">`:`<div class="mini">${x.pos==='G'?'🥅':'🏒'}</div>`}function card(x){return `<div class="card" onclick="profile(${x.id})"><div class="photo" ${x.img?`style="background-image:url('${x.img}')"`:''}>${x.img?'':'🏒'}</div><div class="info"><div class="name">#${x.no} ${esc(x.n)}</div><div class="meta">${x.pos}</div><div class="pts">${x.g+x.a} <span>PUNKTE</span></div><div class="meta">${x.g} T · ${x.a} A</div></div></div>`}
function modal(html){$('sheet').innerHTML=html;$('modal').style.display='flex'}function closeM(){$('modal').style.display='none'}
function openNewGame(){modal(`<h3>Neues Spiel</h3><p class="meta">Gegner, Datum und Saison festlegen.</p><input id="opp" placeholder="Gegner"><input id="date" type="date" value="${new Date().toISOString().slice(0,10)}"><select id="gseason">${d.seasons.map(s=>`<option value="${s.id}" ${s.id===d.activeSeason?'selected':''}>${esc(s.name)}</option>`).join('')}</select><button class="primary" onclick="startGame()">SPIEL STARTEN</button><button class="secondary" onclick="closeM()">Abbrechen</button>`)}function startGame(){if(d.current)finishCurrent(false);let o=$('opp').value.trim();if(!o)return;d.current={id:String(Date.now()),opponent:o,date:$('date').value,season:$('gseason').value,hs:0,as:0,events:[],lineup:d.players.filter(p=>p.status==='Aktiv').map(p=>p.id)};d.current.lineup.forEach(id=>{let p=d.players.find(x=>x.id===id);if(p)p.gp++});d.activity='Spiel gegen '+o+' gestartet.';closeM();save()}function finishCurrent(announce=true){if(!d.current)return;let g=d.current;if(!d.games.some(x=>x.id===g.id))d.games.unshift(g);let goalies=d.players.filter(p=>p.pos==='G'&&g.lineup?.includes(p.id));goalies.forEach(p=>{if(g.hs>g.as)p.goalie.w++;else if(g.hs<g.as)p.goalie.l++;if(g.as===0)p.goalie.so++});d.current=null;if(announce)d.activity='Spiel beendet und gespeichert.';save()}function gameDetail(id){let g=(d.current&&d.current.id===id)?d.current:d.games.find(x=>x.id===id);if(!g)return;go('gameDetail');$('gameDetail').innerHTML=`<div class="hero"><div class="label">${esc(seasonName(g.season))} · ${g.date}</div><h1>${esc(d.team)} ${g.hs}:${g.as} ${esc(g.opponent)}</h1>${g===d.current?'<button class="primary" onclick="finishCurrent();go(\'games\')">SPIEL BEENDEN</button>':''}</div><h2>Spielverlauf</h2><div class="timeline">${g.events.length?g.events.map(eventHTML).join(''):'<div class="empty">Keine Ereignisse erfasst.</div>'}</div>`}function eventHTML(e){if(e.type==='goal'){let s=d.players.find(p=>p.id===e.scorer);let ass=[e.a1,e.a2].filter(Boolean).map(id=>d.players.find(p=>p.id===id)?.n).filter(Boolean).join(', ');return `<div class="event"><div class="grow"><b>TOR · ${esc(s?.n||'Spieler')}</b><div class="meta">${e.strength||'EV'}${ass?' · Assists: '+esc(ass):''}</div></div></div>`}if(e.type==='oppgoal')return `<div class="event"><div class="grow"><b>Gegentor</b><div class="meta">Gegner</div></div></div>`;if(e.type==='save'){let p=d.players.find(x=>x.id===e.goalie);return `<div class="event"><div class="grow"><b>Save · ${esc(p?.n||'Goalie')}</b></div></div></div>`}return ''}
let scorer=null,a1=null,strength='EV';function openGoal(){if(!d.current)return openNewGame();let avail=d.players.filter(p=>p.status==='Aktiv'&&p.pos!=='G');if(!avail.length)return alert('Füge zuerst einen aktiven Feldspieler hinzu.');chooseScorer()}function playerButtons(fn,exclude=[]){return `<div class="players">${d.players.filter(x=>x.status==='Aktiv'&&!exclude.includes(x.id)&&x.pos!=='G').map(x=>`<button class="p" onclick="${fn}(${x.id})">${x.img?`<img src="${x.img}">`:'<div class="face">🏒</div>'}<small>#${x.no}<br><b>${esc(x.n)}</b></small></button>`).join('')}</div>`}function chooseScorer(){modal(`<h3>Wer hat getroffen?</h3>${playerButtons('pickScorer')}<button class="secondary" onclick="closeM()">Abbrechen</button>`)}function pickScorer(id){scorer=id;modal(`<h3>Tor-Art</h3><div class="grid"><button class="p" onclick="pickStrength('EV')">5 gegen 5</button><button class="p" onclick="pickStrength('PP')">Powerplay</button><button class="p" onclick="pickStrength('SH')">Unterzahl</button><button class="p" onclick="pickStrength('EN')">Empty Net</button><button class="p" onclick="pickStrength('PS')">Penalty Shot</button></div>`)}function pickStrength(s){strength=s;modal(`<h3>1. Assist</h3><p class="meta">Optional.</p>${playerButtons('pickA1',[scorer])}<button class="secondary" onclick="pickA1(0)">Kein Assist</button>`)}function pickA1(id){a1=id;modal(`<h3>2. Assist</h3><p class="meta">Optional.</p>${playerButtons('finishGoal',[scorer,id].filter(Boolean))}<button class="secondary" onclick="finishGoal(0)">Kein 2. Assist</button>`)}function finishGoal(a2){let s=d.players.find(x=>x.id===scorer);s.g++;[a1,a2].filter(Boolean).forEach(id=>{let p=d.players.find(x=>x.id===id);if(p)p.a++});d.current.hs++;d.current.events.push({type:'goal',scorer,a1,a2,strength,time:Date.now()});let ass=[a1,a2].filter(Boolean).map(id=>d.players.find(x=>x.id===id)?.n).filter(Boolean);d.activity=`Tor: #${s.no} ${s.n}`+(ass.length?' · Assists: '+ass.join(', '):'')+' · '+strength;closeM();save();$('flashName').textContent='#'+s.no+' '+s.n;$('flashSub').textContent=(s.g)+'. Saisontor · '+strength;if(s.img){$('flashPic').src=s.img;$('flashPic').style.display='block'}else $('flashPic').style.display='none';$('flash').style.display='grid';setTimeout(()=>$('flash').style.display='none',1500)}function addOpponentGoal(){if(!d.current)return openNewGame();d.current.as++;d.current.events.push({type:'oppgoal',time:Date.now()});d.players.filter(p=>p.pos==='G'&&p.status==='Aktiv').forEach(p=>p.goalie.ga++);d.activity='Gegentor eingetragen.';save()}
function openGoalieEvent(){if(!d.current)return openNewGame();let gs=d.players.filter(p=>p.pos==='G'&&p.status==='Aktiv');if(!gs.length)return alert('Füge zuerst einen aktiven Torhüter hinzu.');modal(`<h3>Goalie-Statistik</h3>${gs.map(g=>`<button class="secondary" onclick="goalieSave(${g.id})">SAVE · #${g.no} ${esc(g.n)}</button>`).join('')}<p class="meta">Gegentore werden über „Gegentor“ automatisch gezählt.</p>`)}function goalieSave(id){let p=d.players.find(x=>x.id===id);p.goalie.saves++;d.current.events.push({type:'save',goalie:id,time:Date.now()});d.activity='Save: '+p.n;closeM();save()}
let pendingImg='';function posOptions(sel='C'){return ['C','LW','RW','D','G'].map(x=>`<option ${x===sel?'selected':''}>${x}</option>`).join('')}function statusOptions(sel='Aktiv'){return ['Aktiv','Verletzt','Inaktiv'].map(x=>`<option ${x===sel?'selected':''}>${x}</option>`).join('')}function openPlayerForm(){pendingImg='';modal(`<h3>Spieler hinzufügen</h3><input id="pn" placeholder="Name"><div class="row"><input id="pno" type="number" placeholder="Nr."><select id="pp">${posOptions()}</select></div><select id="pst">${statusOptions()}</select><label class="secondary fileLabel">SPIELERBILD AUSWÄHLEN<input id="pi" type="file" accept="image/*" style="display:none" onchange="previewFile(this)"></label><div id="preview" class="meta">Kein Bild gewählt</div><button class="primary" onclick="addPlayer()">SPEICHERN</button><button class="secondary" onclick="closeM()">Abbrechen</button>`)}function previewFile(inp){let f=inp.files[0];if(!f)return;let r=new FileReader();r.onload=e=>{pendingImg=e.target.result;$('preview').textContent='Bild ausgewählt ✓'};r.readAsDataURL(f)}function addPlayer(){let n=$('pn').value.trim();if(!n)return;d.players.push({id:Date.now(),n,no:+$('pno').value||0,pos:$('pp').value,status:$('pst').value,g:0,a:0,gp:0,img:pendingImg,goalie:{saves:0,ga:0,w:0,l:0,so:0}});pendingImg='';closeM();save()}
function profile(id){let x=d.players.find(p=>p.id===id);if(!x)return;go('profile');let ev=playerEvents(id).slice(0,5);let perGame=ev.map(e=>e.scorer===id?1:1);let trend=perGame.length?`<div class="trend">${perGame.reverse().map((v,i)=>`<i style="height:${25+(i+1)*8}%"></i>`).join('')}</div>`:'';let goalie=x.pos==='G'?`<h2>Torhüter-Stats</h2><div class="goaliegrid"><div><b>${x.goalie.saves}</b>Saves</div><div><b>${(savePct(x)*100).toFixed(1)}%</b>SV%</div><div><b>${x.goalie.ga}</b>GA</div><div><b>${x.goalie.w}</b>Siege</div><div><b>${x.goalie.l}</b>Niederl.</div><div><b>${x.goalie.so}</b>Shutouts</div></div>`:'';$('profile').innerHTML=`<div class="profileHero">${x.img?`<img class="profilePic" src="${x.img}">`:'<div class="profilePic">'+(x.pos==='G'?'🥅':'🏒')+'</div>'}<h1>#${x.no} ${esc(x.n)}</h1><div class="meta">${x.pos} · ${x.status}</div></div><div class="stats4"><div><b>${x.gp}</b>SP</div><div><b>${x.g}</b>T</div><div><b>${x.a}</b>A</div><div><b>${x.g+x.a}</b>P</div></div>${goalie}<h2>Letzte Scorerpunkte</h2>${trend}<div>${ev.length?ev.map(e=>`<div class="event"><div class="grow"><b>${e.scorer===id?'Tor':'Assist'}</b><div class="meta">${e.game.date} · vs. ${esc(e.game.opponent)}</div></div></div>`).join(''):'<div class="empty">Noch keine Scorerpunkte.</div>'}</div><button class="primary" onclick="openPlayerEdit(${x.id})">SPIELER BEARBEITEN</button><button class="danger" onclick="removePlayer(${x.id})">Spieler löschen</button>`}function removePlayer(id){if(confirm('Spieler wirklich löschen?')){d.players=d.players.filter(x=>x.id!==id);save();go('team')}}
function openSettings(){modal(`<h3>Einstellungen</h3><button class="primary" onclick="openTeamEdit()">TEAM BEARBEITEN</button><button class="secondary" onclick="openSeasonManager()">SAISONEN VERWALTEN</button><button class="secondary" onclick="exportBackup()">BACKUP EXPORTIEREN</button><label class="secondary fileLabel">BACKUP IMPORTIEREN<input type="file" accept="application/json,.json" style="display:none" onchange="importBackup(this)"></label><p class="meta">Backup enthält Team, Spieler, Bilder, Spiele und Statistiken.</p><button class="secondary" onclick="closeM()">Schließen</button>`)}
let pendingTeamLogo='';function openTeamEdit(){pendingTeamLogo=d.teamLogo||'';modal(`<h3>Team bearbeiten</h3><input id="tn" value="${esc(d.team)}" placeholder="Teamname"><div class="row"><input id="ts" maxlength="4" value="${esc(d.teamShort)}" placeholder="Kürzel"><input id="tc" value="${esc(d.teamCity||'')}" placeholder="Stadt"></div><div class="row"><div><div class="meta">Primärfarbe</div><input id="c1" type="color" value="${d.teamColors.primary}"></div><div><div class="meta">Sekundärfarbe</div><input id="c2" type="color" value="${d.teamColors.secondary}"></div></div><label class="secondary fileLabel">TEAMLOGO AUSWÄHLEN<input type="file" accept="image/*" style="display:none" onchange="previewTeamLogo(this)"></label><div id="teamPreview" class="meta">${d.teamLogo?'Logo vorhanden ✓':'Kein Logo gewählt'}</div><button class="primary" onclick="saveTeamEdit()">ÄNDERUNGEN SPEICHERN</button><button class="secondary" onclick="closeM()">Abbrechen</button>`)}function previewTeamLogo(inp){let f=inp.files[0];if(!f)return;let r=new FileReader();r.onload=e=>{pendingTeamLogo=e.target.result;$('teamPreview').textContent='Neues Logo ausgewählt ✓'};r.readAsDataURL(f)}function saveTeamEdit(){d.team=$('tn').value.trim()||'Rynq';d.teamShort=($('ts').value.trim()||d.team.slice(0,3)).toUpperCase();d.teamCity=$('tc').value.trim();d.teamLogo=pendingTeamLogo;d.teamColors={primary:$('c1').value,secondary:$('c2').value};document.documentElement.style.setProperty('--team',d.teamColors.primary);closeM();save()}
let editPlayerId=null;function openPlayerEdit(id){let x=d.players.find(p=>p.id===id);editPlayerId=id;pendingImg=x.img||'';modal(`<h3>Spieler bearbeiten</h3><input id="pn" value="${esc(x.n)}"><div class="row"><input id="pno" type="number" value="${x.no}"><select id="pp">${posOptions(x.pos)}</select></div><select id="pst">${statusOptions(x.status)}</select><label class="secondary fileLabel">SPIELERBILD ÄNDERN<input type="file" accept="image/*" style="display:none" onchange="previewFile(this)"></label><div id="preview" class="meta">${x.img?'Bild vorhanden ✓':'Kein Bild gewählt'}</div><button class="primary" onclick="savePlayerEdit()">ÄNDERUNGEN SPEICHERN</button><button class="secondary" onclick="closeM()">Abbrechen</button>`)}function savePlayerEdit(){let x=d.players.find(p=>p.id===editPlayerId);if(!x)return;x.n=$('pn').value.trim()||x.n;x.no=+$('pno').value||0;x.pos=$('pp').value;x.status=$('pst').value;x.img=pendingImg;pendingImg='';closeM();save();profile(x.id)}
function openSeasonManager(){modal(`<h3>Saisonen</h3><p class="meta">Aktiv: ${esc(seasonName(d.activeSeason))}</p>${d.seasons.map(s=>`<button class="secondary" onclick="setSeason('${s.id}');closeM()">${esc(s.name)}${s.id===d.activeSeason?' ✓':''}</button>`).join('')}<input id="newSeason" placeholder="z. B. 2027/28"><button class="primary" onclick="addSeason()">SAISON HINZUFÜGEN</button><button class="secondary" onclick="closeM()">Schließen</button>`)}function addSeason(){let n=$('newSeason').value.trim();if(!n)return;let id=n.replace(/[^0-9A-Za-z]+/g,'-')+'-'+Date.now();d.seasons.push({id,name:n});d.activeSeason=id;closeM();save()}function setSeason(id){d.activeSeason=id;save()}
function exportBackup(){let blob=new Blob([JSON.stringify(d,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='RynqTracker-Backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();URL.revokeObjectURL(a.href);d.activity='Backup exportiert.';closeM();save()}function importBackup(inp){let f=inp.files[0];if(!f)return;let r=new FileReader();r.onload=e=>{try{let x=migrate(JSON.parse(e.target.result));if(!x.players||!x.games)throw Error();if(confirm('Aktuelle Daten durch dieses Backup ersetzen?')){d=x;closeM();save();alert('Backup erfolgreich importiert.')}}catch(err){alert('Das Backup konnte nicht gelesen werden.')}};r.readAsText(f)}
render();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
