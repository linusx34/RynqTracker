function renderStats(){let t=team();if(!t)return;let ps=[...t.players];if(statMode==='goalie')ps=ps.filter(p=>p.pos==='G').sort((a,b)=>savePct(b)-savePct(a));else{if(['p','ppg','shotpct'].includes(statMode))ps=ps.filter(p=>p.pos!=='G');ps.sort((a,b)=>statVal(b)-statVal(a))}$('statsList').innerHTML=ps.length?ps.map((p,i)=>`<div class="statrow click" onclick="profile(${p.id})"><b>${i+1}.</b>${p.img?`<img class="mini" src="${p.img}">`:`<div class="mini">${p.pos==='G'?'🥅':'🏒'}</div>`}<div class="grow"><b>${esc(p.n)}</b><div class="meta">#${p.no} · ${p.pos}${p.pos2?'/'+p.pos2:''}</div></div><div class="bigstat">${statMode==='goalie'?(savePct(p)*100).toFixed(1)+'%':statVal(p)}</div></div>`).join(''):'<div class="empty">Noch keine Daten.</div>'}
function statVal(p){if(statMode==='g')return p.g;if(statMode==='a')return p.a;if(statMode==='ppg')return p.gp?((p.g+p.a)/p.gp).toFixed(2):'0.00';if(statMode==='shotpct')return (p.shots||0)?((p.g/(p.shots||1))*100).toFixed(1)+'%':'0.0%';if(statMode==='pim')return p.pim||0;return p.g+p.a}

function deleteGame(id){let t=team(),g=t.games.find(x=>x.id===id);if(!g)return;if(!confirm('Dieses Spiel wirklich löschen?'))return;if(g.started){t.players.filter(p=>p.status==='Aktiv').forEach(p=>p.gp=Math.max(0,(p.gp||0)-1));(g.events||[]).forEach(e=>{if(e.type==='goal'){let s=t.players.find(p=>p.id===e.scorer);if(s){s.g=Math.max(0,s.g-1);s.shots=Math.max(0,(s.shots||0)-1)};[e.a1,e.a2].filter(Boolean).forEach(a=>{let p=t.players.find(x=>x.id===a);if(p)p.a=Math.max(0,p.a-1)})}if(e.type==='shot'){let p=t.players.find(x=>x.id===e.player);if(p)p.shots=Math.max(0,(p.shots||0)-1)}if(e.type==='penalty'&&e.player){let p=t.players.find(x=>x.id===e.player);if(p)p.pim=Math.max(0,(p.pim||0)-(e.minutes||0))}if(e.type==='save'){let p=t.players.find(x=>x.id===e.goalie);if(p)p.goalie.saves=Math.max(0,p.goalie.saves-1)}if(e.type==='oppgoal')t.players.filter(p=>p.pos==='G'&&p.status==='Aktiv').forEach(p=>p.goalie.ga=Math.max(0,p.goalie.ga-1))})}if(t.current?.id===id)t.current=null;t.games=t.games.filter(x=>x.id!==id);closeM();save()}

function openOpponentDB(){let t=team();t.opponents=t.opponents||[];t.opponentImages=t.opponentImages||{};t.opponentShorts=t.opponentShorts||{};pendingOpponentImg='';modal(`<h3>Gegner-Datenbank</h3>${t.opponents.length?t.opponents.map((o,i)=>`<div class="statrow">${t.opponentImages[o]?`<img class="oppMini" src="${t.opponentImages[o]}">`:`<div class="oppMini">${esc(opponentShort(t,o))}</div>`}<div class="grow"><b>${esc(o)}</b><input class="oppShortInput" value="${esc(t.opponentShorts[o]||'')}" maxlength="6" placeholder="Kürzel" onchange="saveOpponentShort(${i},this.value)"><div class="uploadRow"><label class="secondary fileLabel">BILD ÄNDERN<input type="file" accept="image/*" style="display:none" onchange="saveOpponentImage(this,${i})"></label><div class="uploadThumb">${t.opponentImages[o]?`<img src="${t.opponentImages[o]}" style="width:100%;height:100%;object-fit:cover">`:'＋'}</div></div></div><button class="smallbtn" onclick="removeOpp(${i})">×</button></div>`).join(''):'<div class="empty">Noch keine Gegner gespeichert.</div>'}<input id="newOpp" placeholder="Gegnerteam"><input id="newOppShort" maxlength="6" placeholder="Kürzel, z. B. KEV"><div class="uploadRow"><label class="secondary fileLabel">GEGNERBILD AUSWÄHLEN<input type="file" accept="image/*" style="display:none" onchange="previewOpponentImage(this)"></label><div id="oppPreview" class="uploadThumb">＋</div></div><button class="primary" onclick="addOpp()">HINZUFÜGEN</button><button class="secondary" onclick="closeM()">Schließen</button>`)}

function removeImageBackground(dataUrl,cb){let im=new Image();im.onload=()=>{let c=document.createElement('canvas'),max=700,scale=Math.min(1,max/Math.max(im.width,im.height));c.width=Math.max(1,Math.round(im.width*scale));c.height=Math.max(1,Math.round(im.height*scale));let x=c.getContext('2d');x.drawImage(im,0,0,c.width,c.height);let d=x.getImageData(0,0,c.width,c.height),a=d.data;for(let i=0;i<a.length;i+=4){let r=a[i],g=a[i+1],b=a[i+2],mx=Math.max(r,g,b),mn=Math.min(r,g,b);if(mn>238&&mx-mn<18)a[i+3]=0;else if(mn>215&&mx-mn<24)a[i+3]=Math.min(a[i+3],Math.round((238-mn)/23*255))}x.putImageData(d,0,0);cb(c.toDataURL('image/png'))};im.onerror=()=>cb(dataUrl);im.src=dataUrl}
function previewOpponentImage(inp){let f=inp.files[0];if(!f)return;let r=new FileReader();r.onload=e=>removeImageBackground(e.target.result,img=>{pendingOpponentImg=img;if($('oppPreview'))$('oppPreview').innerHTML=`<img src="${pendingOpponentImg}" style="width:100%;height:100%;object-fit:contain;background:transparent">`});r.readAsDataURL(f)}

function removeOpp(i){let t=team(),o=t.opponents[i];t.opponents.splice(i,1);if(t.opponentImages&&o)delete t.opponentImages[o];if(t.opponentShorts&&o)delete t.opponentShorts[o];save();openOpponentDB()}

let activeLineTab=1;

function slotEligible(p,slot){if(p.status!=='Aktiv')return false;let ps=[p.pos,p.pos2].filter(Boolean);if(slot==='G')return ps.includes('G');if(['LD','RD'].includes(slot))return ps.includes('D');return ps.includes(slot)}
function openSlotPicker(slot){let t=team(),g=t?.current;if(!g||!g.started||g.finished)return;let candidates=t.players.filter(p=>slotEligible(p,slot));let current=slot==='G'?g.lineGoalie:null;if(slot!=='G'){current=+(Object.keys(g.lineSlots||{}).find(id=>(g.lines?.[id]||1)===activeLineTab&&g.lineSlots[id]===slot)||0)}let buttons=candidates.map(p=>`<button class="secondary" onclick="setLinePlayer('${slot}',${p.id})">${p.img?`<img src="${p.img}">`:`<span class="pickFallback">${p.pos==='G'?'🥅':'🏒'}</span>`}<span><b>#${p.no} ${esc(p.n)}</b><br><span class="meta">${p.pos}${p.pos2?'/'+p.pos2:''}${p.id===current?' · aktuell':''}</span></span></button>`).join('');modal(`<h3>${slot==='G'?'Torhüter':slot} auswählen</h3><div class="meta">Es werden nur Spieler angezeigt, die auf dieser Position eingesetzt werden können.</div><div class="positionPick">${buttons||'<div class="empty">Keine passenden aktiven Spieler vorhanden.</div>'}</div>${current?`<button class="danger" onclick="clearLineSlot('${slot}')">POSITION LEEREN</button>`:''}<button class="secondary" onclick="closeM()">Abbrechen</button>`)}
function setLinePlayer(slot,id){let g=team().current;g.roster=g.roster||[];g.lines=g.lines||{};g.lineSlots=g.lineSlots||{};if(!g.roster.includes(id))g.roster.push(id);if(slot==='G'){g.lineGoalie=id}else{Object.keys(g.lineSlots).forEach(pid=>{if((g.lines[pid]||1)===activeLineTab&&g.lineSlots[pid]===slot)delete g.lineSlots[pid]});g.lines[id]=activeLineTab;g.lineSlots[id]=slot}closeM();save()}
function clearLineSlot(slot){let g=team().current;if(slot==='G')g.lineGoalie=null;else Object.keys(g.lineSlots||{}).forEach(pid=>{if((g.lines?.[pid]||1)===activeLineTab&&g.lineSlots[pid]===slot)delete g.lineSlots[pid]});closeM();save()}
function renderStartingLineup(){let box=$('startingLineup'),t=team(),g=t?.current;if(!box)return;if(!g||!g.started||g.finished){box.innerHTML='';return}let ids=g.roster?.length?g.roster:[],players=ids.map(id=>t.players.find(p=>p.id===id)).filter(Boolean);g.lines=g.lines||{};g.lineSlots=g.lineSlots||{};let goalie=t.players.find(p=>p.id===g.lineGoalie)||null,line=players.filter(p=>p.pos!=='G'&&(g.lines[p.id]||1)===activeLineTab),slotMap={};line.forEach(p=>{let s=g.lineSlots[p.id];if(s&&!slotMap[s])slotMap[s]=p});let card=(p,slot)=>{if(!p)return `<div class="rinkSlot ${slot}" onclick="openSlotPicker('${slot}')"><div class="rinkEmpty">＋</div><div class="rinkPos">${slot}</div></div>`;let pts=playerGamePoints(g,p.id);return `<div class="rinkSlot ${slot}" onclick="openSlotPicker('${slot}')"><div class="rinkFace">${p.img?`<img src="${p.img}">`:p.pos==='G'?'🥅':'🏒'}<div class="rinkMarks">${pts.goals?`<span class="rinkMark">🥅${pts.goals}</span>`:''}${pts.assists?`<span class="rinkMark">A${pts.assists}</span>`:''}</div></div><div class="rinkName">${p.no} ${esc(surname(p.n))}</div><div class="rinkPos">${slot}</div></div>`};box.innerHTML=`<div class="lineupBox"><div class="label">AUFSTELLUNG</div><div class="lineTabs">${[1,2,3,4].map(n=>`<button class="lineTab ${activeLineTab===n?'active':''}" onclick="setLineTab(${n})">REIHE ${n}</button>`).join('')}</div><div class="rink"><div class="rinkLine one"></div><div class="rinkLine two"></div><div class="rinkCircle c1"></div><div class="rinkCircle c2"></div><div class="rinkCircle c3"></div><div class="rinkCircle c4"></div>${card(slotMap.LW,'LW')}${card(slotMap.C,'C')}${card(slotMap.RW,'RW')}${card(slotMap.LD,'LD')}${card(slotMap.RD,'RD')}${card(goalie,'G')}</div><div class="lineupHint">Tippe auf + oder einen Spieler, um die Position zu ändern.</div></div>`}
function openShot(){if(team()?.current?.paused)return alert('Das Spiel ist pausiert.');let t=team();if(!t.current||!t.current.started||t.current.finished)return alert('Starte zuerst ein Spiel.');let ps=eligiblePlayers(false);modal(`<h3>Schuss von …</h3><div class="players">${ps.map(p=>`<button class="p" onclick="addShot(${p.id})"><b>#${p.no}</b><div>${esc(p.n)}</div></button>`).join('')}</div><button class="secondary" onclick="closeM()">Abbrechen</button>`)}
function addShot(id){let t=team(),p=t.players.find(x=>x.id===id);p.shots=(p.shots||0)+1;t.current.events.push({type:'shot',player:id,time:Date.now()});t.activity='Schuss: '+p.n;closeM();save()}
function openPenalty(side='home'){if(team()?.current?.paused)return alert('Das Spiel ist pausiert.');let t=team();if(!t.current||!t.current.started||t.current.finished)return alert('Starte zuerst ein Spiel.');let reasons=['Beinstellen','Haken','Halten','Stockschlag','Hoher Stock','Behinderung','Bandencheck','Check gegen Kopf/Nacken','Check von hinten','Übertriebene Härte','Cross-Check','Ellbogencheck','Kniecheck','Charging / Unerlaubter Körperangriff','Spielverzögerung','Zu viele Spieler auf dem Eis','Unsportliches Verhalten','Disziplinarstrafe','Kampf / Fighting','Spearing','Butt-Ending','Kicking','Leaving the Bench','Penalty Shot / Regelverstoß'];let who=side==='opp'?`<div class="panel" style="margin-top:10px;padding:12px"><b>${esc(t.current.opponent)}</b></div>`:`<select id="penp"><option value="">Spieler auswählen</option>${eligiblePlayers(true).map(p=>`<option value="${p.id}">#${p.no} ${esc(p.n)}</option>`).join('')}</select>`;modal(`<h3>${side==='opp'?'Strafe (Gegner)':'Strafe (Heim)'}</h3>${who}<select id="penm"><option value="2">2 Minuten</option><option value="4">2+2 Minuten</option><option value="5">5 Minuten</option><option value="10">10 Minuten</option><option value="20">20 Minuten / Spieldauer</option></select><select id="penr">${reasons.map(r=>`<option value="${r}">${r}</option>`).join('')}</select><button class="primary" onclick="addPenalty('${side}')">SPEICHERN</button><button class="secondary" onclick="closeM()">Abbrechen</button>`)}
function addPenalty(side='home'){let t=team(),m=+$('penm').value,r=$('penr').value,pid=side==='opp'?null:+$('penp').value;if(side==='home'&&!pid)return alert('Bitte Spieler auswählen.');if(pid){let p=t.players.find(x=>x.id===pid);p.pim=(p.pim||0)+m}t.current.events.push({type:'penalty',player:pid,side,minutes:m,reason:r,time:Date.now()});t.activity=`${m} Min. · ${r}`;closeM();save()}
function tickTime(e){return new Date(e.time).toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'})}
function scoreSheet(g){let t=team();return (g.events||[]).slice().reverse().map(e=>{if(e.type==='goal'){let s=t.players.find(p=>p.id===e.scorer),a=[e.a1,e.a2].filter(Boolean).map(id=>t.players.find(p=>p.id===id)?.n).filter(Boolean);return `<div class="tick"><div class="ticktime">${tickTime(e)} · TOR · ${e.strength||''}</div><b>#${s?.no||''} ${esc(s?.n||'Spieler')}</b><div class="meta">${a.length?'Assists: '+a.map(esc).join(', '):'Ohne Assist'}</div></div>`}if(e.type==='oppgoal')return `<div class="tick"><div class="ticktime">${tickTime(e)} · GEGENTOR</div><b>${esc(g.opponent)}</b></div>`;if(e.type==='penalty'){let p=e.player?t.players.find(x=>x.id===e.player):null;return `<div class="tick pen"><div class="ticktime">${tickTime(e)} · ${e.minutes} MIN STRAFE</div><b>${p?esc(p.n):esc(g.opponent)}</b><div class="meta">${esc(e.reason)}</div></div>`}if(e.type==='save'){let p=t.players.find(x=>x.id===e.goalie);return `<div class="tick"><div class="ticktime">${tickTime(e)} · SAVE</div><b>${esc(p?.n||'Goalie')}</b></div>`}return ''}).join('')}
let calendarCursor=new Date();
function changeCalendarMonth(delta){calendarCursor=new Date(calendarCursor.getFullYear(),calendarCursor.getMonth()+delta,1);drawCalendar()}
function drawCalendar(){let box=$('calendar'),t=team();if(!box||!t)return;let y=calendarCursor.getFullYear(),m=calendarCursor.getMonth(),days=new Date(y,m+1,0).getDate(),off=(new Date(y,m,1).getDay()+6)%7,monthGames=t.games.filter(g=>g.season===t.activeSeason).filter(g=>{let d=new Date(g.date+'T12:00:00');return d.getFullYear()===y&&d.getMonth()===m}),byDay={};monthGames.forEach(g=>(byDay[+g.date.slice(-2)]??=[]).push(g));let cells='';for(let i=0;i<off;i++)cells+='<div></div>';for(let d=1;d<=days;d++){let gs=byDay[d]||[],done=gs.filter(g=>g.finished),first=gs[0],oi=first?t.opponentImages?.[first.opponent]:'';cells+=`<div class="calday ${gs.length?'hasgame':''}"><span>${d}</span>${oi?`<img class="calOppLogo" src="${oi}" alt="">`:''}${done.map(g=>`<span class="calScore">${g.hs}:${g.as}${g.decision==='OT'?' OT':g.decision==='SO'?' SO':''}</span>`).join('')}</div>`}let title=new Date(y,m,1).toLocaleDateString('de-DE',{month:'long',year:'numeric'});box.innerHTML=`<div class="calendar"><div class="calendarHead"><button class="smallbtn calendarNav" onclick="changeCalendarMonth(-1)">‹</button><b>${title}</b><button class="smallbtn calendarNav" onclick="changeCalendarMonth(1)">›</button></div><div class="calgrid">${['Mo','Di','Mi','Do','Fr','Sa','So'].map(x=>`<b>${x}</b>`).join('')}${cells}</div></div>`}
render();
</script></body></html>
