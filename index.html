<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#090b10"><link rel="manifest" href="manifest.webmanifest"><title>RinqTracker</title><style>
*{box-sizing:border-box}body{margin:0;background:#090b10;color:#fff;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}.app{max-width:430px;margin:auto;min-height:100vh;padding:22px 18px 100px}.top{display:flex;justify-content:space-between;align-items:center}.brand{font-size:24px;font-weight:900;letter-spacing:-1px}.brand i{font-style:normal;color:#68a4ff}.pill{border:1px solid #293242;background:#141923;color:#fff;border-radius:14px;padding:9px 12px;font-weight:700}.hero,.panel{margin-top:20px;padding:20px;border:1px solid #242b37;border-radius:26px;background:linear-gradient(145deg,#171c26,#0e1118)}.label{font-size:11px;letter-spacing:1.5px;color:#8b96a8;font-weight:800}.teams{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;margin:18px 0}.team{text-align:center}.logo{width:66px;height:66px;margin:auto;border-radius:20px;display:grid;place-items:center;background:#202837;font-size:22px;font-weight:900}.score{font-size:42px;font-weight:900}.status{text-align:center;color:#9ba5b5;font-size:13px}.primary,.secondary,.danger{width:100%;margin-top:14px;border:0;border-radius:17px;padding:16px;font-size:15px;font-weight:900}.primary{background:#fff;color:#080a0e}.secondary{background:#202631;color:#fff;border:1px solid #303847}.danger{background:#2b171b;color:#ff9aa8;border:1px solid #58303a}h2{font-size:19px;margin:26px 0 13px}.leaders{display:flex;gap:12px;overflow:auto;padding-bottom:5px}.card{min-width:142px;background:#131720;border:1px solid #242b37;border-radius:21px;overflow:hidden;cursor:pointer}.photo{height:112px;background:linear-gradient(160deg,#31405a,#151a24);display:grid;place-items:center;font-size:48px;background-size:cover;background-position:center}.info{padding:12px}.name{font-weight:800}.meta{font-size:11px;color:#8993a3;margin-top:3px}.pts{font-size:22px;font-weight:900;margin-top:8px}.pts span{font-size:10px;color:#8d98aa}.nav{position:fixed;z-index:20;bottom:0;left:50%;transform:translateX(-50%);width:min(430px,100%);height:82px;background:#0c0f15f2;backdrop-filter:blur(16px);border-top:1px solid #242934;display:flex;justify-content:space-around;padding-top:13px}.nav button{border:0;background:none;color:#778294;font-size:9px;font-weight:700}.nav b{display:grid;place-items:center;height:23px;margin-bottom:4px}.nav svg,.icon svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}.pill svg{width:19px;height:19px;vertical-align:middle;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.nav .active{color:#fff}.page{display:none}.page.active{display:block}.modal{position:fixed;z-index:30;inset:0;background:#05070bef;display:none;align-items:flex-end;justify-content:center}.sheet{max-height:88vh;overflow:auto;width:min(430px,100%);background:#151922;border-radius:28px 28px 0 0;padding:24px 18px 34px}.sheet h3{margin:0 0 5px;font-size:24px}.players,.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.p{background:#202631;border:1px solid #303847;border-radius:16px;padding:12px;text-align:center}.p img{width:64px;height:64px;object-fit:cover;border-radius:16px}.face{font-size:35px}.row{display:flex;gap:10px}.row>*{flex:1}input,select{width:100%;padding:14px;margin-top:10px;border-radius:14px;border:1px solid #303847;background:#0f131a;color:#fff;font-size:15px}.statrow,.game{display:flex;align-items:center;gap:12px;padding:13px;background:#131720;border:1px solid #242b37;border-radius:17px;margin-bottom:9px}.statrow .mini{width:48px;height:48px;border-radius:13px;background:#202837;object-fit:cover;display:grid;place-items:center}.grow{flex:1}.bigstat{font-weight:900;font-size:18px}.flash{position:fixed;z-index:50;inset:0;background:#fff;color:#05070b;display:none;place-items:center;text-align:center;animation:pop .45s ease}.flash strong{font-size:55px;letter-spacing:-4px}@keyframes pop{0%{transform:scale(.8);opacity:0}100%{transform:scale(1);opacity:1}}.empty{color:#8993a3;text-align:center;padding:28px}.profileHero{text-align:center}.profilePic{width:150px;height:150px;border-radius:30px;object-fit:cover;background:#202837;font-size:70px;display:grid;place-items:center;margin:10px auto}.stats4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.stats4 div{text-align:center;background:#131720;border-radius:15px;padding:12px 5px}.stats4 b{font-size:22px;display:block}.click{cursor:pointer}
</style></head><body><main class="app"><div class="top"><div class="brand">Rinq<i>Tracker</i></div><button class="pill" onclick="openSettings()" aria-label="Einstellungen"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1-2.8 2.8-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.6v.2h-4v-.2a1.7 1.7 0 0 0-1-1.6 1.7 1.7 0 0 0-1.9.3l-.1.1L4.2 17l.1-.1a1.7 1.7 0 0 0 .3-1.9A1.7 1.7 0 0 0 3 14H2.8v-4H3a1.7 1.7 0 0 0 1.6-1 1.7 1.7 0 0 0-.3-1.9L4.2 7 7 4.2l.1.1a1.7 1.7 0 0 0 1.9.3 1.7 1.7 0 0 0 1-1.6v-.2h4V3a1.7 1.7 0 0 0 1 1.6 1.7 1.7 0 0 0 1.9-.3l.1-.1L19.8 7l-.1.1a1.7 1.7 0 0 0-.3 1.9 1.7 1.7 0 0 0 1.6 1h.2v4H21a1.7 1.7 0 0 0-1.6 1Z"/></svg></button></div>
<section id="homePage" class="page active"><div class="hero"><div class="label">AKTUELLES SPIEL</div><div class="teams"><div class="team"><div class="logo" id="homeLogo">RT</div><b id="homeTeam">RINQ</b></div><div class="score"><span id="homeScore">0</span> : <span id="awayScore">0</span></div><div class="team"><div class="logo" id="awayLogo">G</div><b id="awayTeam">GEGNER</b></div></div><div class="status" id="gameStatus">Noch kein Spiel gestartet</div><button class="primary" onclick="openGoal()">＋ TOR EINTRAGEN</button><button class="secondary" onclick="openNewGame()">NEUES SPIEL</button></div><h2>Punkte-Leader</h2><div class="leaders" id="leaders"></div><h2>Letzte Aktion</h2><div class="panel" id="activity">Noch keine Aktion.</div></section>
<section id="gamesPage" class="page"><h2>Spiele</h2><button class="primary" onclick="openNewGame()">＋ NEUES SPIEL</button><div id="gamesList" style="margin-top:14px"></div></section>
<section id="trackPage" class="page"><h2>Live-Tracker</h2><div class="panel"><div class="label">SCHNELLERFASSUNG</div><button class="primary" onclick="openGoal()">🥅 TOR</button><button class="secondary" onclick="addOpponentGoal()">Gegentor +1</button></div><div class="panel"><b id="trackScore">0 : 0</b><div class="meta">Aktueller Spielstand</div></div></section>
<section id="teamPage" class="page"><h2>Mannschaft</h2><button class="secondary" onclick="openTeamEdit()">TEAM BEARBEITEN</button><button class="primary" onclick="openPlayerForm()">＋ SPIELER HINZUFÜGEN</button><div id="teamList" style="margin-top:14px"></div></section>
<section id="statsPage" class="page"><h2>Statistiken</h2><div id="statsList"></div></section>
<section id="profilePage" class="page"><button class="pill" onclick="go('team')">‹ Zurück</button><div id="profile"></div></section>
</main>
<nav class="nav"><button data-p="home" class="active" onclick="go('home')"><b><svg viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/></svg></b>HOME</button><button data-p="games" onclick="go('games')"><b><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M8 3v4M16 3v4M3 10h18"/></svg></b>SPIELE</button><button data-p="track" onclick="go('track')"><b><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg></b>TRACK</button><button data-p="team" onclick="go('team')"><b><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3"/><circle cx="17" cy="9" r="2"/><path d="M3 20c0-4 2.7-6 6-6s6 2 6 6M15 15c3 0 5 1.7 5 5"/></svg></b>TEAM</button><button data-p="stats" onclick="go('stats')"><b><svg viewBox="0 0 24 24"><path d="M5 20V10M12 20V4M19 20v-7"/></svg></b>STATS</button></nav>
<div class="modal" id="modal"><div class="sheet" id="sheet"></div></div><div class="flash" id="flash"><div><strong>TOOOR!</strong><div id="flashName"></div></div></div>
<script>
const defaults={team:'Rinq',teamShort:'RT',teamLogo:'',teamCity:'',players:[{id:1,n:'Alex Frost',no:19,pos:'Stürmer',g:0,a:0,gp:0,img:''},{id:2,n:'Noah Reed',no:8,pos:'Stürmer',g:0,a:0,gp:0,img:''},{id:3,n:'Finn Cole',no:91,pos:'Verteidiger',g:0,a:0,gp:0,img:''}],games:[],current:null,activity:'Noch keine Aktion.'};let d=JSON.parse(localStorage.getItem('rinqV2'))||structuredClone(defaults);d.teamShort=d.teamShort||d.team.slice(0,3).toUpperCase();d.teamLogo=d.teamLogo||'';d.teamCity=d.teamCity||'';const save=()=>{localStorage.setItem('rinqV2',JSON.stringify(d));render()};
function go(p){document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));document.getElementById(p+'Page').classList.add('active');document.querySelectorAll('.nav button').forEach(x=>x.classList.toggle('active',x.dataset.p===p));render()}
function render(){let c=d.current;document.getElementById('homeTeam').textContent=d.team.toUpperCase();document.getElementById('homeLogo').innerHTML=d.teamLogo?`<img src="${d.teamLogo}" style="width:100%;height:100%;object-fit:cover;border-radius:20px">`:d.teamShort.slice(0,3).toUpperCase();document.getElementById('awayTeam').textContent=c?c.opponent.toUpperCase():'GEGNER';document.getElementById('awayLogo').textContent=c?c.opponent.slice(0,2).toUpperCase():'G';document.getElementById('homeScore').textContent=c?c.hs:0;document.getElementById('awayScore').textContent=c?c.as:0;document.getElementById('trackScore').textContent=(c?c.hs:0)+' : '+(c?c.as:0);document.getElementById('gameStatus').textContent=c?'Live · '+c.date:'Noch kein Spiel gestartet';document.getElementById('activity').textContent=d.activity;
let sorted=[...d.players].sort((a,b)=>(b.g+b.a)-(a.g+a.a));document.getElementById('leaders').innerHTML=sorted.map(x=>card(x)).join('')||'<div class="empty">Noch keine Spieler.</div>';document.getElementById('teamList').innerHTML=d.players.map(x=>`<div class="statrow click" onclick="profile(${x.id})">${mini(x)}<div class="grow"><b>#${x.no} ${x.n}</b><div class="meta">${x.pos}</div></div><b>›</b></div>`).join('');document.getElementById('statsList').innerHTML=sorted.map((x,i)=>`<div class="statrow">${mini(x)}<div class="grow"><b>${i+1}. ${x.n}</b><div class="meta">${x.g} Tore · ${x.a} Assists</div></div><div class="bigstat">${x.g+x.a} P</div></div>`).join('');document.getElementById('gamesList').innerHTML=d.games.map(g=>`<div class="game"><div class="grow"><b>${d.team} – ${g.opponent}</b><div class="meta">${g.date}</div></div><b>${g.hs}:${g.as}</b></div>`).join('')||'<div class="empty">Noch keine Spiele gespeichert.</div>'}
function mini(x){return x.img?`<img class="mini" src="${x.img}">`:`<div class="mini">🏒</div>`}function card(x){return `<div class="card" onclick="profile(${x.id})"><div class="photo" ${x.img?`style="background-image:url('${x.img}')"`:''}>${x.img?'':'🏒'}</div><div class="info"><div class="name">#${x.no} ${x.n}</div><div class="meta">${x.pos}</div><div class="pts">${x.g+x.a} <span>PUNKTE</span></div><div class="meta">${x.g} T · ${x.a} A</div></div></div>`}
function modal(html){sheet.innerHTML=html;document.getElementById('modal').style.display='flex'}function closeM(){document.getElementById('modal').style.display='none'}
function openNewGame(){modal(`<h3>Neues Spiel</h3><p class="meta">Gegner und Datum festlegen.</p><input id="opp" placeholder="Gegner"><input id="date" type="date" value="${new Date().toISOString().slice(0,10)}"><button class="primary" onclick="startGame()">SPIEL STARTEN</button><button class="secondary" onclick="closeM()">Abbrechen</button>`)}function startGame(){if(d.current)d.games.unshift(d.current);let o=document.getElementById('opp').value.trim();if(!o)return;d.current={opponent:o,date:document.getElementById('date').value,hs:0,as:0,events:[]};d.players.forEach(p=>p.gp++);d.activity='Spiel gegen '+o+' gestartet.';closeM();save()}
let scorer=null,a1=null;function openGoal(){if(!d.current)return openNewGame();chooseScorer()}function playerButtons(fn,exclude=[]){return `<div class="players">${d.players.filter(x=>!exclude.includes(x.id)).map(x=>`<button class="p" onclick="${fn}(${x.id})">${x.img?`<img src="${x.img}">`:'<div class="face">🏒</div>'}<small>#${x.no}<br><b>${x.n}</b></small></button>`).join('')}</div>`}function chooseScorer(){modal(`<h3>Wer hat getroffen?</h3><p class="meta">Torschützen auswählen.</p>${playerButtons('pickScorer')}<button class="secondary" onclick="closeM()">Abbrechen</button>`)}function pickScorer(id){scorer=id;modal(`<h3>1. Assist</h3><p class="meta">Optional.</p>${playerButtons('pickA1',[id])}<button class="secondary" onclick="pickA1(0)">Kein Assist</button>`)}function pickA1(id){a1=id;modal(`<h3>2. Assist</h3><p class="meta">Optional.</p>${playerButtons('finishGoal',[scorer,id].filter(Boolean))}<button class="secondary" onclick="finishGoal(0)">Kein 2. Assist</button>`)}function finishGoal(a2){let s=d.players.find(x=>x.id===scorer);s.g++;[a1,a2].filter(Boolean).forEach(id=>d.players.find(x=>x.id===id).a++);d.current.hs++;d.current.events.push({type:'goal',scorer,a1,a2});d.activity=`Tor: #${s.no} ${s.n}`+(a1?' · Assists: '+[a1,a2].filter(Boolean).map(id=>d.players.find(x=>x.id===id).n).join(', '):'');closeM();save();flashName.textContent='#'+s.no+' '+s.n;flash.style.display='grid';setTimeout(()=>flash.style.display='none',1100)}function addOpponentGoal(){if(!d.current)return openNewGame();d.current.as++;d.activity='Gegentor eingetragen.';save()}
function openPlayerForm(){modal(`<h3>Spieler hinzufügen</h3><input id="pn" placeholder="Name"><div class="row"><input id="pno" type="number" placeholder="Nr."><select id="pp"><option>Stürmer</option><option>Verteidiger</option><option>Torhüter</option></select></div><label class="secondary" style="display:block;text-align:center">📷 Spielerbild auswählen<input id="pi" type="file" accept="image/*" style="display:none" onchange="previewFile(this)"></label><div id="preview" class="meta" style="margin-top:8px">Kein Bild gewählt</div><button class="primary" onclick="addPlayer()">SPEICHERN</button><button class="secondary" onclick="closeM()">Abbrechen</button>`)}let pendingImg='';function previewFile(inp){let f=inp.files[0];if(!f)return;let r=new FileReader();r.onload=e=>{pendingImg=e.target.result;preview.textContent='Bild ausgewählt ✓'};r.readAsDataURL(f)}function addPlayer(){let n=pn.value.trim();if(!n)return;d.players.push({id:Date.now(),n,no:+pno.value||0,pos:pp.value,g:0,a:0,gp:0,img:pendingImg});pendingImg='';closeM();save()}
function profile(id){let x=d.players.find(p=>p.id===id);go('profile');document.getElementById('profile').innerHTML=`<div class="profileHero">${x.img?`<img class="profilePic" src="${x.img}">`:'<div class="profilePic">🏒</div>'}<h1>#${x.no} ${x.n}</h1><div class="meta">${x.pos}</div></div><div class="stats4"><div><b>${x.gp}</b>SP</div><div><b>${x.g}</b>T</div><div><b>${x.a}</b>A</div><div><b>${x.g+x.a}</b>P</div></div><button class="primary" onclick="openPlayerEdit(${x.id})">SPIELER BEARBEITEN</button><button class="danger" onclick="removePlayer(${x.id})">Spieler löschen</button>`}function removePlayer(id){if(confirm('Spieler wirklich löschen?')){d.players=d.players.filter(x=>x.id!==id);save();go('team')}}
function openSettings(){modal(`<h3>Einstellungen</h3><button class="primary" onclick="openTeamEdit()">TEAM BEARBEITEN</button><button class="secondary" onclick="closeM()">Schließen</button>`)}
let pendingTeamLogo='';function openTeamEdit(){pendingTeamLogo=d.teamLogo||'';modal(`<h3>Team bearbeiten</h3><p class="meta">Name, Kürzel, Stadt und Teamlogo ändern.</p><label class="meta">Teamname</label><input id="tn" value="${d.team}"><div class="row"><input id="ts" maxlength="3" value="${d.teamShort}" placeholder="Kürzel"><input id="tc" value="${d.teamCity||''}" placeholder="Stadt"></div><label class="secondary" style="display:block;text-align:center">TEAMLOGO AUSWÄHLEN<input type="file" accept="image/*" style="display:none" onchange="previewTeamLogo(this)"></label><div id="teamPreview" class="meta" style="margin-top:8px">${d.teamLogo?'Logo vorhanden ✓':'Kein Logo gewählt'}</div><button class="primary" onclick="saveTeamEdit()">ÄNDERUNGEN SPEICHERN</button><button class="secondary" onclick="closeM()">Abbrechen</button>`)}
function previewTeamLogo(inp){let f=inp.files[0];if(!f)return;let r=new FileReader();r.onload=e=>{pendingTeamLogo=e.target.result;teamPreview.textContent='Neues Logo ausgewählt ✓'};r.readAsDataURL(f)}
function saveTeamEdit(){d.team=tn.value.trim()||'Rinq';d.teamShort=(ts.value.trim()||d.team.slice(0,3)).toUpperCase();d.teamCity=tc.value.trim();d.teamLogo=pendingTeamLogo;closeM();save()}
let editPlayerId=null;function openPlayerEdit(id){let x=d.players.find(p=>p.id===id);editPlayerId=id;pendingImg=x.img||'';modal(`<h3>Spieler bearbeiten</h3><input id="pn" value="${x.n}" placeholder="Name"><div class="row"><input id="pno" type="number" value="${x.no}" placeholder="Nr."><select id="pp"><option ${x.pos==='Stürmer'?'selected':''}>Stürmer</option><option ${x.pos==='Verteidiger'?'selected':''}>Verteidiger</option><option ${x.pos==='Torhüter'?'selected':''}>Torhüter</option></select></div><label class="secondary" style="display:block;text-align:center">SPIELERBILD ÄNDERN<input type="file" accept="image/*" style="display:none" onchange="previewFile(this)"></label><div id="preview" class="meta" style="margin-top:8px">${x.img?'Bild vorhanden ✓':'Kein Bild gewählt'}</div><button class="primary" onclick="savePlayerEdit()">ÄNDERUNGEN SPEICHERN</button><button class="secondary" onclick="closeM()">Abbrechen</button>`)}
function savePlayerEdit(){let x=d.players.find(p=>p.id===editPlayerId);if(!x)return;x.n=pn.value.trim()||x.n;x.no=+pno.value||0;x.pos=pp.value;x.img=pendingImg;pendingImg='';closeM();save();profile(x.id)}
render();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
